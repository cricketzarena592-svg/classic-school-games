<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matricks - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .board-frame {
      width: 100%;
      max-width: 900px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 1.75rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4), 0 0 2px var(--chalk-white);
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      background-color: var(--chalk-purple);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.6rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      border: 2px solid var(--chalk-dim);
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--chalk-white);
      background: transparent;
      color: var(--chalk-white);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .toggle-btn.active {
      background: var(--chalk-purple);
      color: #1a1a1a;
      border-color: var(--chalk-purple);
      text-shadow: none;
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .room-input {
      padding: 0.3rem 0.6rem;
      border: 2px solid var(--chalk-purple);
      border-radius: 6px;
      background: transparent;
      color: var(--chalk-purple);
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
      width: 90px;
      text-transform: uppercase;
      outline: none;
    }

    .peer-status-badge {
      font-family: var(--font-chalk-hand);
      font-size: 0.95rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      border: 1px dashed var(--chalk-dim);
      color: var(--chalk-yellow);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d4d;
      display: inline-block;
    }

    .status-dot.online {
      background: var(--chalk-green);
      box-shadow: 0 0 6px var(--chalk-green);
    }

    .host-crown {
      color: var(--chalk-yellow);
      margin-left: 0.2rem;
    }

    .status-banner {
      font-family: var(--font-chalk-hand);
      font-size: 1.4rem;
      color: var(--chalk-purple);
      min-height: 28px;
      text-align: center;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 3px var(--chalk-purple);
    }

    .arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      min-height: 240px;
      border: 2px solid var(--chalk-dim);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 1rem;
      background: rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    .player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .player-title {
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      color: var(--chalk-white);
    }

    .loads-badge {
      background-color: var(--chalk-purple);
      color: #1a1a1a;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
    }

    .gesture-display {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed var(--chalk-white);
      padding: 12px;
    }

    .gesture-display svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--chalk-white);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 2px var(--chalk-white));
    }

    .vs-divider {
      font-family: var(--font-chalk-heading);
      font-size: 2rem;
      color: var(--chalk-yellow);
      text-shadow: 0 0 4px var(--chalk-yellow);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .move-btn {
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--chalk-purple);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      color: var(--chalk-purple);
      padding: 0.75rem 0.5rem;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .move-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--chalk-purple);
    }

    .move-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--chalk-dim);
      color: var(--chalk-dim);
    }

    .btn-svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }

    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--board-bg);
      border: 3px dashed var(--chalk-white);
      border-radius: 12px;
      padding: 1.75rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      color: var(--chalk-white);
    }

    .modal-card h2 {
      font-family: var(--font-chalk-heading);
      color: var(--chalk-yellow);
      font-size: 2rem;
    }

    .modal-btn {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-family: var(--font-chalk-hand);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      background-color: var(--chalk-purple);
      color: #1a1a1a;
    }

    .share-box {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-dim);
      padding: 0.85rem;
      border-radius: 8px;
      font-family: var(--font-chalk-sub);
      font-size: 1rem;
      word-break: break-all;
      color: var(--chalk-green);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--board-bg);
      color: var(--chalk-yellow);
      border: 2px solid var(--chalk-yellow);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
          <span class="peer-status-badge" id="peerStatusBadge">
            <span class="status-dot" id="peerStatusDot"></span>
            <span id="peerStatusText">Disconnected</span>
          </span>
        </div>
      </div>

      <div class="status-banner" id="statusBanner">Choose your hand gesture!</div>

      <div class="arena">
        <div class="player-box">
          <span class="player-title" id="p1Name">You</span>
          <span class="loads-badge" id="p1Loads">0 Loads</span>
          <div class="gesture-display" id="p1Gesture"></div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="player-box">
          <span class="player-title" id="p2Name">Opponent Bot</span>
          <span class="loads-badge" id="p2Loads">0 Loads</span>
          <div class="gesture-display" id="p2Gesture"></div>
        </div>
      </div>

      <div class="controls-grid">
        <button class="move-btn" id="btnLoad" onclick="playTurn('load')">
          <div id="svg-btn-load"></div>
          <span>LOAD</span>
        </button>

        <button class="move-btn" id="btnShoot1" onclick="playTurn('shoot1')">
          <div id="svg-btn-shoot1"></div>
          <span>GUN (1)</span>
        </button>

        <button class="move-btn" id="btnShield1" onclick="playTurn('shield1')">
          <div id="svg-btn-shield1"></div>
          <span>SHIELD (1)</span>
        </button>

        <button class="move-btn" id="btnShoot2" onclick="playTurn('shoot2')">
          <div id="svg-btn-shoot2"></div>
          <span>GUN (2)</span>
        </button>

        <button class="move-btn" id="btnShield2" onclick="playTurn('shield2')">
          <div id="svg-btn-shield2"></div>
          <span>SHIELD (2)</span>
        </button>

        <button class="move-btn" id="btnShoot3" onclick="playTurn('shoot3')">
          <div id="svg-btn-shoot3"></div>
          <span>GUN (3)</span>
        </button>

        <button class="move-btn" id="btnShield3" onclick="playTurn('shield3')">
          <div id="svg-btn-shield3"></div>
          <span>SHIELD (3)</span>
        </button>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-purple);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    /* Vector SVG Hand Art */
    const SVG_TEMPLATES = {
      none: `<svg viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      load: `<svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 0 1 2 2v4a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6v-1.5"/></svg>`,
      shoot1: `<svg viewBox="0 0 24 24"><path d="M22 10H10a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h2"/><path d="M10 10V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7"/><path d="M12 15v3a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3"/></svg>`,
      shield1: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
      shoot2: `<svg viewBox="0 0 24 24"><path d="M22 8H10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2"/><path d="M22 14H10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2"/><path d="M12 18v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3"/></svg>`,
      shield2: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v8"/></svg>`,
      shoot3: `<svg viewBox="0 0 24 24"><path d="M22 6H10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2"/><path d="M22 12H10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2"/><path d="M22 18H10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h2"/></svg>`,
      shield3: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 7v10M8 12h8"/></svg>`
    };

    function renderSVGs() {
      document.getElementById('p1Gesture').innerHTML = SVG_TEMPLATES.none;
      document.getElementById('p2Gesture').innerHTML = SVG_TEMPLATES.none;

      Object.keys(SVG_TEMPLATES).forEach(key => {
        const btnElem = document.getElementById(`svg-btn-${key}`);
        if (btnElem) {
          btnElem.innerHTML = SVG_TEMPLATES[key];
          const svg = btnElem.querySelector('svg');
          if (svg) svg.classList.add('btn-svg');
        }
      });
    }

    /* Web Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'load') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      } else if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      } else if (type === 'shield') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    /* Theme Engine */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }
    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    /* Game State & Interception Rules */
    let p1Loads = 0;
    let p2Loads = 0;
    let gameMode = 'bot';
    let p1Move = null;
    let p2Move = null;
    let summaryShareText = '';

    /* Peer-to-Peer / WebRTC Multiplayer Infrastructure */
    let roomChannel = null;
    let peerConnection = null;
    let dataChannel = null;
    let currentRoomCode = '';
    let isHost = false;
    let peerConnected = false;
    let localPeerId = Math.random().toString(36).substring(2, 9);
    let remotePeerId = null;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    const MOVES = {
      load: { name: 'Load', cost: 0, tier: 0, type: 'load' },
      shoot1: { name: 'Gun (1)', cost: 1, tier: 1, type: 'gun' },
      shield1: { name: 'Shield (1)', cost: 0, tier: 1, type: 'shield' },
      shoot2: { name: 'Gun (2)', cost: 2, tier: 2, type: 'gun' },
      shield2: { name: 'Shield (2)', cost: 0, tier: 2, type: 'shield' },
      shoot3: { name: 'Gun (3)', cost: 3, tier: 3, type: 'gun' },
      shield3: { name: 'Shield (3)', cost: 0, tier: 3, type: 'shield' }
    };

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function updatePeerStatus(connected, text) {
      peerConnected = connected;
      const dot = document.getElementById('peerStatusDot');
      const label = document.getElementById('peerStatusText');
      if (dot) dot.classList.toggle('online', connected);
      if (label) label.textContent = text || (connected ? 'Connected' : 'Waiting...');
    }

    function switchMode(mode) {
      gameMode = mode;
      document.getElementById('modeBotBtn').classList.toggle('active', mode === 'bot');
      document.getElementById('modeRoomBtn').classList.toggle('active', mode === 'room');
      document.getElementById('roomControls').style.display = mode === 'room' ? 'flex' : 'none';
      
      if (mode === 'bot') {
        if (roomChannel) { roomChannel.close(); roomChannel = null; }
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        document.getElementById('p1Name').textContent = 'You';
        document.getElementById('p2Name').textContent = 'Opponent Bot';
        updatePeerStatus(false, 'Disconnected');
      }
      resetGame(false);
    }

    function createRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('roomCodeInput').value = code;

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, true);
      navigator.clipboard.writeText(newUrl.href);
      showToast(`Room Created! Direct Link Copied: ${code}`);
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { showToast('Enter room code'); return; }

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, false);
      showToast(`Joining Room: ${code}`);
    }

    function initRoom(code, host) {
      if (roomChannel) roomChannel.close();
      if (peerConnection) peerConnection.close();

      currentRoomCode = code;
      isHost = host;
      updatePeerStatus(false, 'Connecting...');

      document.getElementById('p1Name').innerHTML = isHost ? 'You <span class="host-crown">👑</span>' : 'You';
      document.getElementById('p2Name').innerHTML = isHost ? 'Opponent' : 'Opponent <span class="host-crown">👑</span>';

      roomChannel = new BroadcastChannel(`matricks_room_${code}`);
      
      roomChannel.onmessage = async (e) => {
        const data = e.data;
        if (data.targetId && data.targetId !== localPeerId) return;

        if (data.type === 'PEER_JOIN' && isHost) {
          remotePeerId = data.senderId;
          setupPeerConnection();
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          roomChannel.postMessage({
            type: 'SIGNAL_OFFER',
            senderId: localPeerId,
            targetId: remotePeerId,
            sdp: offer
          });
        } else if (data.type === 'SIGNAL_OFFER' && !isHost) {
          remotePeerId = data.senderId;
          setupPeerConnection();
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          roomChannel.postMessage({
            type: 'SIGNAL_ANSWER',
            senderId: localPeerId,
            targetId: remotePeerId,
            sdp: answer
          });
        } else if (data.type === 'SIGNAL_ANSWER' && isHost) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        } else if (data.type === 'ICE_CANDIDATE') {
          if (peerConnection) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(err){}
          }
        }
      };

      if (!isHost) {
        roomChannel.postMessage({ type: 'PEER_JOIN', senderId: localPeerId });
      }
      resetGame(false);
    }

    function setupPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && roomChannel) {
          roomChannel.postMessage({
            type: 'ICE_CANDIDATE',
            senderId: localPeerId,
            targetId: remotePeerId,
            candidate: event.candidate
          });
        }
      };

      if (isHost) {
        dataChannel = peerConnection.createDataChannel('gameData');
        bindDataChannelEvents();
      } else {
        peerConnection.ondatachannel = (event) => {
          dataChannel = event.channel;
          bindDataChannelEvents();
        };
      }
    }

    function bindDataChannelEvents() {
      dataChannel.onopen = () => {
        updatePeerStatus(true, 'Connected');
        showToast('P2P Connection Established!');
        if (isHost) {
          sendP2PMessage({ type: 'SYNC_STATE', p1Loads: p1Loads, p2Loads: p2Loads });
        }
      };

      dataChannel.onclose = () => {
        updatePeerStatus(false, 'Disconnected');
      };

      dataChannel.onmessage = (e) => {
        const data = JSON.parse(e.data);
        handleP2PMessage(data);
      };
    }

    function sendP2PMessage(msg) {
      if (dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify(msg));
      }
    }

    function handleP2PMessage(data) {
      if (data.type === 'MOVE') {
        if (isHost) p2Move = data.move;
        else p1Move = data.move;
        checkMultiplayerTurn();
      } else if (data.type === 'RESET') {
        resetGame(false);
      } else if (data.type === 'SYNC_STATE') {
        p1Loads = data.p2Loads;
        p2Loads = data.p1Loads;
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('p1Loads').textContent = `${p1Loads} Load${p1Loads === 1 ? '' : 's'}`;
      document.getElementById('p2Loads').textContent = `${p2Loads} Load${p2Loads === 1 ? '' : 's'}`;

      document.getElementById('btnShoot1').disabled = p1Loads < 1;
      document.getElementById('btnShoot2').disabled = p1Loads < 2;
      document.getElementById('btnShoot3').disabled = p1Loads < 3;
    }

    function getBotMove() {
      const valid = ['load', 'shield1', 'shield2', 'shield3'];
      if (p2Loads >= 1) valid.push('shoot1');
      if (p2Loads >= 2) valid.push('shoot2');
      if (p2Loads >= 3) valid.push('shoot3');

      if (p2Loads >= 3 && Math.random() < 0.7) return 'shoot3';
      if (p1Loads === 0 && Math.random() < 0.5) return 'load';
      
      return valid[Math.floor(Math.random() * valid.length)];
    }

    function playTurn(m1Key) {
      if (gameMode === 'bot') {
        const m2Key = getBotMove();
        processRound(m1Key, m2Key);
      } else {
        if (!peerConnected) { showToast('Waiting for P2P connection'); return; }
        if (isHost) p1Move = m1Key;
        else p2Move = m1Key;

        document.getElementById('statusBanner').textContent = "Waiting for Opponent move...";
        sendP2PMessage({ type: 'MOVE', move: m1Key });
        checkMultiplayerTurn();
      }
    }

    function checkMultiplayerTurn() {
      if (p1Move && p2Move) {
        processRound(p1Move, p2Move);
        p1Move = null;
        p2Move = null;
      }
    }

    function processRound(m1Key, m2Key) {
      const m1 = MOVES[m1Key];
      const m2 = MOVES[m2Key];

      p1Loads -= m1.cost;
      p2Loads -= m2.cost;

      if (m1Key === 'load') p1Loads++;
      if (m2Key === 'load') p2Loads++;

      document.getElementById('p1Gesture').innerHTML = SVG_TEMPLATES[m1Key];
      document.getElementById('p2Gesture').innerHTML = SVG_TEMPLATES[m2Key];

      playSound(m1.type === 'gun' ? 'shoot' : m1.type === 'shield' ? 'shield' : 'load');
      updateUI();

      setTimeout(() => evaluateMatch(m1, m2), 100);
    }

    function evaluateMatch(m1, m2) {
      let winner = null;
      let statusText = "Game Continues!";

      if (m1.type === 'gun' && m2.type === 'gun') {
        if (m1.tier > m2.tier) winner = 'p1';
        else if (m2.tier > m1.tier) winner = 'p2';
        else statusText = "Guns cancelled out!";
      } else if (m1.type === 'gun' && m2.type === 'shield') {
        if (m1.tier > m2.tier) winner = 'p1';
        else statusText = "Shield blocked the gun!";
      } else if (m1.type === 'shield' && m2.type === 'gun') {
        if (m2.tier > m1.tier) winner = 'p2';
        else statusText = "Shield blocked the gun!";
      } else if (m1.type === 'gun' && m2.type === 'load') {
        winner = 'p1';
      } else if (m1.type === 'load' && m2.type === 'gun') {
        winner = 'p2';
      }

      document.getElementById('statusBanner').textContent = statusText;

      if (winner) {
        const p1Won = winner === 'p1';
        const title = p1Won ? "YOU WIN!" : "YOU LOST!";
        const msg = p1Won ? `${m1.name} penetrated opponent's defense!` : `Opponent's ${m2.name} eliminated you!`;
        
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMsg').textContent = msg;

        summaryShareText = `🖐️ Matricks Results:\nResult: ${title}\nFinal Action: ${m1.name} vs ${m2.name}\nPlay on ClassicSchoolGames!`;
        document.getElementById('shareResultText').textContent = `${title} | ${m1.name} vs ${m2.name}`;

        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({ title: 'Matricks Result', text: summaryShareText }).catch(() => {});
      } else {
        navigator.clipboard.writeText(summaryShareText);
        showToast('Result copied to clipboard!');
      }
    }

    function resetGame(broadcast = true) {
      p1Loads = 0;
      p2Loads = 0;
      p1Move = null;
      p2Move = null;
      document.getElementById('p1Gesture').innerHTML = SVG_TEMPLATES.none;
      document.getElementById('p2Gesture').innerHTML = SVG_TEMPLATES.none;
      document.getElementById('statusBanner').textContent = "Choose your hand gesture!";
      document.getElementById('gameOverModal').style.display = 'none';
      if (broadcast && gameMode === 'room') {
        sendP2PMessage({ type: 'RESET' });
      }
      updateUI();
    }

    // Auto-join via URL query parameter if present
    window.addEventListener('DOMContentLoaded', () => {
      renderSVGs();
      updateUI();
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        switchMode('room');
        document.getElementById('roomCodeInput').value = roomParam;
        joinRoom();
      }
    });
  </script>
</body>
</html>
