<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matricks - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/matricks.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
          <span class="peer-status-badge" id="peerStatusBadge">
            <span class="status-dot" id="peerStatusDot"></span>
            <span id="peerStatusText">Disconnected</span>
          </span>
        </div>
      </div>

      <div class="status-banner" id="statusBanner">Choose your hand gesture!</div>

      <div class="arena">
        <div class="player-box">
          <span class="player-title" id="p1Name">You</span>
          <span class="loads-badge" id="p1Loads">0 Loads</span>
          <div class="gesture-display" id="p1Gesture"></div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="player-box">
          <span class="player-title" id="p2Name">Opponent Bot</span>
          <span class="loads-badge" id="p2Loads">0 Loads</span>
          <div class="gesture-display" id="p2Gesture"></div>
        </div>
      </div>

      <div class="controls-grid">
        <button class="move-btn" id="btnLoad" onclick="playTurn('load')">
          <div id="svg-btn-load"></div>
          <span>LOAD</span>
        </button>

        <button class="move-btn" id="btnShoot1" onclick="playTurn('shoot1')">
          <div id="svg-btn-shoot1"></div>
          <span>GUN (1)</span>
        </button>

        <button class="move-btn" id="btnShield1" onclick="playTurn('shield1')">
          <div id="svg-btn-shield1"></div>
          <span>SHIELD (1)</span>
        </button>

        <button class="move-btn" id="btnShoot2" onclick="playTurn('shoot2')">
          <div id="svg-btn-shoot2"></div>
          <span>GUN (2)</span>
        </button>

        <button class="move-btn" id="btnShield2" onclick="playTurn('shield2')">
          <div id="svg-btn-shield2"></div>
          <span>SHIELD (2)</span>
        </button>

        <button class="move-btn" id="btnShoot3" onclick="playTurn('shoot3')">
          <div id="svg-btn-shoot3"></div>
          <span>GUN (3)</span>
        </button>

        <button class="move-btn" id="btnShield3" onclick="playTurn('shield3')">
          <div id="svg-btn-shield3"></div>
          <span>SHIELD (3)</span>
        </button>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-purple);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script src="frontend/js/matricks.js"></script>
</body>
</html>
