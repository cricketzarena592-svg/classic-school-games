<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Cricket - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="frontend/css/handcricket.css">
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
          <span class="peer-status-badge" id="peerStatusBadge">
            <span class="status-dot" id="peerStatusDot"></span>
            <span id="peerStatusText">Disconnected</span>
          </span>
        </div>
      </div>

      <div class="scoreboard">
        <div>Innings: <span id="inningsText">1st</span></div>
        <div>Target: <span id="targetText">-</span></div>
        <div>Score: <span id="scoreText">0</span></div>
      </div>

      <div class="status-banner" id="statusBanner">Choose Heads or Tails for the Toss!</div>

      <div class="arena">
        <div class="player-box">
          <span class="player-title" id="p1Name">You</span>
          <span class="role-badge" id="p1Role">Toss</span>
          <div class="gesture-display" id="p1Gesture">
            <canvas id="p1Canvas" width="200" height="200"></canvas>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="player-box">
          <span class="player-title" id="p2Name">Bot</span>
          <span class="role-badge" id="p2Role">Toss</span>
          <div class="gesture-display" id="p2Gesture">
            <canvas id="p2Canvas" width="200" height="200"></canvas>
          </div>
        </div>
      </div>

      <div class="controls-grid" id="numberControls">
        <button class="move-btn" id="btn1" onclick="playRun(1)" disabled>
          <canvas id="btnCanvas1" class="btn-canvas" width="100" height="100"></canvas>
          <span>1</span>
        </button>
        <button class="move-btn" id="btn2" onclick="playRun(2)" disabled>
          <canvas id="btnCanvas2" class="btn-canvas" width="100" height="100"></canvas>
          <span>2</span>
        </button>
        <button class="move-btn" id="btn3" onclick="playRun(3)" disabled>
          <canvas id="btnCanvas3" class="btn-canvas" width="100" height="100"></canvas>
          <span>3</span>
        </button>
        <button class="move-btn" id="btn4" onclick="playRun(4)" disabled>
          <canvas id="btnCanvas4" class="btn-canvas" width="100" height="100"></canvas>
          <span>4</span>
        </button>
        <button class="move-btn" id="btn5" onclick="playRun(5)" disabled>
          <canvas id="btnCanvas5" class="btn-canvas" width="100" height="100"></canvas>
          <span>5</span>
        </button>
        <button class="move-btn" id="btn6" onclick="playRun(6)" disabled>
          <canvas id="btnCanvas6" class="btn-canvas" width="100" height="100"></canvas>
          <span>6</span>
        </button>
      </div>

      <!-- Toss Modal -->
      <div class="modal-overlay" id="tossModal" style="display: flex;">
        <div class="modal-card">
          <h2 id="tossHeading">Toss Time!</h2>
          <p id="tossSubtext" style="font-size:1.1rem; color:var(--chalk-white);">Choose Heads or Tails</p>
          <div class="toss-options" id="tossOptionsBox">
            <button class="modal-btn" onclick="makeTossCall('Heads')">Heads</button>
            <button class="modal-btn" onclick="makeTossCall('Tails')">Tails</button>
          </div>
        </div>
      </div>

      <!-- Role Modal -->
      <div class="modal-overlay" id="roleModal">
        <div class="modal-card">
          <h2 id="tossResultTitle">You Won the Toss!</h2>
          <p style="font-size:1.1rem; color:var(--chalk-white);">Choose your role to start:</p>
          <div class="toss-options">
            <button class="modal-btn" onclick="setRole('Batting')">Bat</button>
            <button class="modal-btn" onclick="setRole('Bowling')">Bowl</button>
          </div>
        </div>
      </div>

      <!-- General In-App Notification Modal -->
      <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
          <h2 id="infoTitle">NOTIFICATION</h2>
          <p id="infoMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <button class="modal-btn" id="infoActionBtn" onclick="closeInfoModal()">Continue</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-green);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script src="frontend/js/handcricket.js"></script>
</body>
</html>
