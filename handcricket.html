<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Cricket - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .board-frame {
      width: 100%;
      max-width: 850px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 1.75rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4), 0 0 2px var(--chalk-white);
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      background-color: var(--chalk-green);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.6rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      border: 2px solid var(--chalk-dim);
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--chalk-white);
      background: transparent;
      color: var(--chalk-white);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .toggle-btn.active {
      background: var(--chalk-green);
      color: #1a1a1a;
      border-color: var(--chalk-green);
      text-shadow: none;
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .room-input {
      padding: 0.3rem 0.6rem;
      border: 2px solid var(--chalk-green);
      border-radius: 6px;
      background: transparent;
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
      width: 90px;
      text-transform: uppercase;
      outline: none;
    }

    .peer-status-badge {
      font-family: var(--font-chalk-hand);
      font-size: 0.95rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      border: 1px dashed var(--chalk-dim);
      color: var(--chalk-yellow);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d4d;
      display: inline-block;
    }

    .status-dot.online {
      background: var(--chalk-green);
      box-shadow: 0 0 6px var(--chalk-green);
    }

    .host-crown {
      color: var(--chalk-yellow);
      margin-left: 0.2rem;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px dashed var(--chalk-dim);
      font-family: var(--font-chalk-hand);
      font-size: 1.25rem;
      color: var(--chalk-yellow);
      position: relative;
      z-index: 2;
    }

    .scoreboard span {
      color: var(--chalk-white);
    }

    .status-banner {
      font-family: var(--font-chalk-hand);
      font-size: 1.4rem;
      color: var(--chalk-green);
      min-height: 28px;
      text-align: center;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 3px var(--chalk-green);
    }

    .arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      min-height: 220px;
      border: 2px solid var(--chalk-dim);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 1rem;
      background: rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    .player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .player-title {
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      color: var(--chalk-white);
    }

    .role-badge {
      background-color: var(--chalk-green);
      color: #1a1a1a;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .gesture-display {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed var(--chalk-white);
      padding: 5px;
    }

    .gesture-display canvas {
      width: 100px;
      height: 100px;
    }

    .vs-divider {
      font-family: var(--font-chalk-heading);
      font-size: 2rem;
      color: var(--chalk-yellow);
      text-shadow: 0 0 4px var(--chalk-yellow);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.75rem;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .move-btn {
      background-color: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--chalk-green);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      color: var(--chalk-green);
      padding: 0.6rem 0.25rem;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s ease;
    }

    .move-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--chalk-green);
    }

    .move-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--chalk-dim);
      color: var(--chalk-dim);
    }

    .btn-canvas {
      width: 36px;
      height: 36px;
    }

    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }

    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--board-bg);
      border: 3px dashed var(--chalk-white);
      border-radius: 12px;
      padding: 1.75rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      color: var(--chalk-white);
    }

    .modal-card h2 {
      font-family: var(--font-chalk-heading);
      color: var(--chalk-yellow);
      font-size: 2rem;
    }

    .toss-options {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .modal-btn {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-family: var(--font-chalk-hand);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      background-color: var(--chalk-green);
      color: #1a1a1a;
    }

    .share-box {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-dim);
      padding: 0.85rem;
      border-radius: 8px;
      font-family: var(--font-chalk-sub);
      font-size: 1rem;
      word-break: break-all;
      color: var(--chalk-green);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--board-bg);
      color: var(--chalk-yellow);
      border: 2px solid var(--chalk-yellow);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
          <span class="peer-status-badge" id="peerStatusBadge">
            <span class="status-dot" id="peerStatusDot"></span>
            <span id="peerStatusText">Disconnected</span>
          </span>
        </div>
      </div>

      <div class="scoreboard">
        <div>Innings: <span id="inningsText">1st</span></div>
        <div>Target: <span id="targetText">-</span></div>
        <div>Score: <span id="scoreText">0</span></div>
      </div>

      <div class="status-banner" id="statusBanner">Choose Heads or Tails for the Toss!</div>

      <div class="arena">
        <div class="player-box">
          <span class="player-title" id="p1Name">You</span>
          <span class="role-badge" id="p1Role">Toss</span>
          <div class="gesture-display" id="p1Gesture">
            <canvas id="p1Canvas" width="200" height="200"></canvas>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="player-box">
          <span class="player-title" id="p2Name">Bot</span>
          <span class="role-badge" id="p2Role">Toss</span>
          <div class="gesture-display" id="p2Gesture">
            <canvas id="p2Canvas" width="200" height="200"></canvas>
          </div>
        </div>
      </div>

      <div class="controls-grid" id="numberControls">
        <button class="move-btn" id="btn1" onclick="playRun(1)" disabled>
          <canvas id="btnCanvas1" class="btn-canvas" width="100" height="100"></canvas>
          <span>1</span>
        </button>
        <button class="move-btn" id="btn2" onclick="playRun(2)" disabled>
          <canvas id="btnCanvas2" class="btn-canvas" width="100" height="100"></canvas>
          <span>2</span>
        </button>
        <button class="move-btn" id="btn3" onclick="playRun(3)" disabled>
          <canvas id="btnCanvas3" class="btn-canvas" width="100" height="100"></canvas>
          <span>3</span>
        </button>
        <button class="move-btn" id="btn4" onclick="playRun(4)" disabled>
          <canvas id="btnCanvas4" class="btn-canvas" width="100" height="100"></canvas>
          <span>4</span>
        </button>
        <button class="move-btn" id="btn5" onclick="playRun(5)" disabled>
          <canvas id="btnCanvas5" class="btn-canvas" width="100" height="100"></canvas>
          <span>5</span>
        </button>
        <button class="move-btn" id="btn6" onclick="playRun(6)" disabled>
          <canvas id="btnCanvas6" class="btn-canvas" width="100" height="100"></canvas>
          <span>6</span>
        </button>
      </div>

      <!-- Toss Modal -->
      <div class="modal-overlay" id="tossModal" style="display: flex;">
        <div class="modal-card">
          <h2 id="tossHeading">Toss Time!</h2>
          <p id="tossSubtext" style="font-size:1.1rem; color:var(--chalk-white);">Choose Heads or Tails</p>
          <div class="toss-options" id="tossOptionsBox">
            <button class="modal-btn" onclick="makeTossCall('Heads')">Heads</button>
            <button class="modal-btn" onclick="makeTossCall('Tails')">Tails</button>
          </div>
        </div>
      </div>

      <!-- Role Modal -->
      <div class="modal-overlay" id="roleModal">
        <div class="modal-card">
          <h2 id="tossResultTitle">You Won the Toss!</h2>
          <p style="font-size:1.1rem; color:var(--chalk-white);">Choose your role to start:</p>
          <div class="toss-options">
            <button class="modal-btn" onclick="setRole('Batting')">Bat</button>
            <button class="modal-btn" onclick="setRole('Bowling')">Bowl</button>
          </div>
        </div>
      </div>

      <!-- General In-App Notification Modal -->
      <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
          <h2 id="infoTitle">NOTIFICATION</h2>
          <p id="infoMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <button class="modal-btn" id="infoActionBtn" onclick="closeInfoModal()">Continue</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-green);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    /* 2D HTML5 Canvas Human Hand Drawing Engine */
    function drawHumanHand(canvas, number) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      
      ctx.clearRect(0, 0, w, h);
      if (number === 0) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Colors
      const skinGrad = ctx.createLinearGradient(0, 0, w, h);
      skinGrad.addColorStop(0, '#ffdbac');
      skinGrad.addColorStop(1, '#e0ac69');
      
      const strokeColor = '#8d5b4c';
      const detailColor = '#c68642';

      ctx.fillStyle = skinGrad;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = w * 0.035;

      const fingersExtended = {
        thumb:  number === 5 || number === 6,
        index:  number >= 1 && number <= 5,
        middle: number >= 2 && number <= 5,
        ring:   number >= 3 && number <= 5,
        pinky:  number >= 4 && number <= 5
      };

      // Wrist & Base Palm
      ctx.beginPath();
      ctx.moveTo(w * 0.32, h);
      ctx.lineTo(w * 0.32, h * 0.75);
      ctx.bezierCurveTo(w * 0.2, h * 0.7, w * 0.18, h * 0.55, w * 0.28, h * 0.45);
      ctx.bezierCurveTo(w * 0.35, h * 0.38, w * 0.65, h * 0.38, w * 0.75, h * 0.48);
      ctx.bezierCurveTo(w * 0.82, h * 0.6, w * 0.8, h * 0.72, w * 0.68, h * 0.75);
      ctx.lineTo(w * 0.68, h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      function drawExtendedFinger(x, yUp, yDown, width, angle = 0) {
        ctx.save();
        ctx.translate(x, yDown);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.rect(-width / 2, -(yDown - yUp), width, yDown - yUp);
        ctx.arc(0, -(yDown - yUp), width / 2, Math.PI, 0);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = detailColor;
        ctx.lineWidth = width * 0.2;
        ctx.beginPath();
        ctx.moveTo(-width * 0.3, -(yDown - yUp) * 0.5);
        ctx.lineTo(width * 0.3, -(yDown - yUp) * 0.5);
        ctx.stroke();
        ctx.restore();
      }

      function drawFoldedFinger(x, y, width) {
        ctx.beginPath();
        ctx.arc(x, y, width / 1.8, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
      }

      if (fingersExtended.index) drawExtendedFinger(w * 0.36, h * 0.12, h * 0.45, w * 0.11, -0.05);
      else drawFoldedFinger(w * 0.36, h * 0.45, w * 0.11);

      if (fingersExtended.middle) drawExtendedFinger(w * 0.48, h * 0.08, h * 0.44, w * 0.11, 0);
      else drawFoldedFinger(w * 0.48, h * 0.44, w * 0.11);

      if (fingersExtended.ring) drawExtendedFinger(w * 0.6, h * 0.12, h * 0.45, w * 0.10, 0.05);
      else drawFoldedFinger(w * 0.6, h * 0.45, w * 0.10);

      if (fingersExtended.pinky) drawExtendedFinger(w * 0.71, h * 0.2, h * 0.48, w * 0.09, 0.1);
      else drawFoldedFinger(w * 0.71, h * 0.48, w * 0.09);

      ctx.save();
      if (fingersExtended.thumb) {
        ctx.beginPath();
        ctx.moveTo(w * 0.3, h * 0.62);
        ctx.bezierCurveTo(w * 0.12, h * 0.55, w * 0.08, h * 0.38, w * 0.22, h * 0.38);
        ctx.bezierCurveTo(w * 0.32, h * 0.38, w * 0.34, h * 0.52, w * 0.34, h * 0.55);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(w * 0.28, h * 0.62);
        ctx.quadraticCurveTo(w * 0.42, h * 0.58, w * 0.52, h * 0.62);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = detailColor;
      ctx.lineWidth = w * 0.02;
      ctx.beginPath();
      ctx.moveTo(w * 0.3, h * 0.55);
      ctx.quadraticCurveTo(w * 0.48, h * 0.6, w * 0.68, h * 0.52);
      ctx.moveTo(w * 0.32, h * 0.65);
      ctx.quadraticCurveTo(w * 0.52, h * 0.72, w * 0.66, h * 0.62);
      ctx.stroke();

      ctx.restore();
    }

    function renderAllHands() {
      drawHumanHand(document.getElementById('p1Canvas'), 0);
      drawHumanHand(document.getElementById('p2Canvas'), 0);

      for (let i = 1; i <= 6; i++) {
        const btnCanvas = document.getElementById(`btnCanvas${i}`);
        if (btnCanvas) {
          drawHumanHand(btnCanvas, i);
        }
      }
    }

    /* Web Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      } else if (type === 'out') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    /* Theme Engine */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }
    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    /* Modal Handler */
    let onModalCloseCallback = null;

    function showInfoModal(title, msg, callback = null) {
      document.getElementById('infoTitle').textContent = title;
      document.getElementById('infoMsg').textContent = msg;
      document.getElementById('infoModal').style.display = 'flex';
      onModalCloseCallback = callback;
    }

    function closeInfoModal() {
      document.getElementById('infoModal').style.display = 'none';
      if (onModalCloseCallback) {
        const cb = onModalCloseCallback;
        onModalCloseCallback = null;
        cb();
      }
    }

    /* Game State Variables */
    let p1Role = ''; 
    let currentInnings = 1;
    let currentScore = 0;
    let targetScore = null;
    let gameMode = 'bot';
    let p1RunChoice = null;
    let p2RunChoice = null;
    let summaryShareText = '';

    /* PeerJS WebRTC Infrastructure */
    let peer = null;
    let dataChannel = null;
    let currentRoomCode = '';
    let isHost = false;
    let peerConnected = false;

    function updatePeerStatus(connected, text) {
      peerConnected = connected;
      const dot = document.getElementById('peerStatusDot');
      const label = document.getElementById('peerStatusText');
      if (dot) dot.classList.toggle('online', connected);
      if (label) label.textContent = text || (connected ? 'Connected' : 'Waiting...');
    }

    function switchMode(mode) {
      gameMode = mode;
      document.getElementById('modeBotBtn').classList.toggle('active', mode === 'bot');
      document.getElementById('modeRoomBtn').classList.toggle('active', mode === 'room');
      document.getElementById('roomControls').style.display = mode === 'room' ? 'flex' : 'none';
      
      if (mode === 'bot') {
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (peer) { peer.destroy(); peer = null; }
        document.getElementById('p1Name').textContent = 'You';
        document.getElementById('p2Name').textContent = 'Bot';
        updatePeerStatus(false, 'Disconnected');
      }
      resetGame(false);
    }

    function createRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('roomCodeInput').value = code;
      
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, true);
      navigator.clipboard.writeText(newUrl.href);
      showToast(`Room Created! Direct Link Copied: ${code}`);
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { showToast('Enter room code'); return; }
      
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, false);
      showToast(`Joining Room: ${code}`);
    }

    function initRoom(code, host) {
      if (dataChannel) { dataChannel.close(); dataChannel = null; }
      if (peer) { peer.destroy(); peer = null; }

      currentRoomCode = code;
      isHost = host;
      updatePeerStatus(false, 'Connecting...');

      document.getElementById('p1Name').innerHTML = isHost ? 'You <span class="host-crown">👑</span>' : 'You';
      document.getElementById('p2Name').innerHTML = isHost ? 'Opponent' : 'Opponent <span class="host-crown">👑</span>';

      const peerId = isHost ? `handcricket_${code}` : undefined;
      peer = new Peer(peerId);

      peer.on('open', () => {
        if (!isHost) {
          dataChannel = peer.connect(`handcricket_${code}`);
          bindDataChannelEvents();
        }
      });

      peer.on('connection', (conn) => {
        if (isHost) {
          dataChannel = conn;
          bindDataChannelEvents();
        }
      });

      peer.on('error', (err) => {
        showToast('Connection error');
        updatePeerStatus(false, 'Failed');
      });

      resetGame(false);
    }

    function bindDataChannelEvents() {
      dataChannel.on('open', () => {
        updatePeerStatus(true, 'Connected');
        showToast('P2P Connection Established!');
        
        if (isHost) {
          document.getElementById('tossHeading').textContent = 'Toss Time!';
          document.getElementById('tossSubtext').textContent = 'Choose Heads or Tails';
          document.getElementById('tossOptionsBox').style.display = 'flex';
          document.getElementById('tossModal').style.display = 'flex';

          sendP2PMessage({
            type: 'SYNC_STATE',
            innings: currentInnings,
            score: currentScore,
            target: targetScore,
            p1Role: p1Role
          });
        } else {
          document.getElementById('tossHeading').textContent = 'Toss Time!';
          document.getElementById('tossSubtext').textContent = 'Waiting for Host to flip the coin...';
          document.getElementById('tossOptionsBox').style.display = 'none';
          document.getElementById('tossModal').style.display = 'flex';
        }
      });

      dataChannel.on('close', () => {
        updatePeerStatus(false, 'Disconnected');
      });

      dataChannel.on('data', (data) => {
        handleP2PMessage(data);
      });
    }

    function sendP2PMessage(msg) {
      if (dataChannel && dataChannel.open) {
        dataChannel.send(msg);
      }
    }

    function handleP2PMessage(data) {
      if (data.type === 'MOVE') {
        if (isHost) p2RunChoice = data.run;
        else p1RunChoice = data.run;
        checkMultiplayerTurn();
      } else if (data.type === 'RESET') {
        resetGame(false);
      } else if (data.type === 'TOSS_RESULT') {
        processTossOutcome(data.winnerIsHost, data.coinResult, data.calledValue);
      } else if (data.type === 'ROLE_CHOICE') {
        applyRoleChoice(data.role);
      } else if (data.type === 'SYNC_STATE') {
        currentInnings = data.innings;
        currentScore = data.score;
        targetScore = data.target;
        p1Role = data.p1Role === 'Batting' ? 'Bowling' : 'Batting';
        if (currentInnings > 1 || p1Role) startInnings();
      }
    }

    function setControlsState(enabled) {
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`btn${i}`).disabled = !enabled;
      }
    }

    function makeTossCall(call) {
      if (gameMode === 'room') {
        if (!peerConnected) { showToast('Waiting for opponent connection...'); return; }
        if (!isHost) return;

        const coinResult = Math.random() < 0.5 ? 'Heads' : 'Tails';
        const hostWon = call === coinResult;

        sendP2PMessage({ 
          type: 'TOSS_RESULT', 
          winnerIsHost: hostWon,
          coinResult: coinResult,
          calledValue: call
        });

        processTossOutcome(hostWon, coinResult, call);
      } else {
        document.getElementById('tossModal').style.display = 'none';
        const tossWin = Math.random() < 0.5;

        if (tossWin) {
          document.getElementById('tossResultTitle').textContent = `Toss came up ${call}! You Won!`;
          document.getElementById('roleModal').style.display = 'flex';
        } else {
          const botRole = Math.random() < 0.5 ? 'Batting' : 'Bowling';
          p1Role = botRole === 'Batting' ? 'Bowling' : 'Batting';
          showInfoModal("TOSS LOST", `Toss came up opposite! Opponent chose to ${botRole.toLowerCase()} first.`, () => {
            startInnings();
          });
        }
      }
    }

    function processTossOutcome(winnerIsHost, coinResult, calledValue) {
      document.getElementById('tossModal').style.display = 'none';
      const userIsWinner = (isHost && winnerIsHost) || (!isHost && !winnerIsHost);

      if (userIsWinner) {
        document.getElementById('tossResultTitle').textContent = `Coin was ${coinResult}! You Won the Toss!`;
        document.getElementById('roleModal').style.display = 'flex';
      } else {
        showInfoModal("TOSS RESULT", `Coin landed on ${coinResult}. Opponent won the toss and is choosing role...`);
      }
    }

    function setRole(role) {
      p1Role = role;
      document.getElementById('roleModal').style.display = 'none';
      if (gameMode === 'room') {
        sendP2PMessage({ type: 'ROLE_CHOICE', role: role });
      }
      startInnings();
    }

    function applyRoleChoice(chosenRole) {
      document.getElementById('infoModal').style.display = 'none';
      p1Role = chosenRole === 'Batting' ? 'Bowling' : 'Batting';
      startInnings();
    }

    function startInnings() {
      document.getElementById('p1Role').textContent = p1Role;
      document.getElementById('p2Role').textContent = p1Role === 'Batting' ? 'Bowling' : 'Batting';
      document.getElementById('inningsText').textContent = currentInnings === 1 ? '1st' : '2nd';
      document.getElementById('targetText').textContent = targetScore !== null ? targetScore : '-';
      document.getElementById('scoreText').textContent = currentScore;
      document.getElementById('statusBanner').textContent = p1Role === 'Batting' ? 'You are Batting! Tap a run.' : 'You are Bowling! Try to match opponent.';
      setControlsState(true);
    }

    function playRun(run) {
      if (gameMode === 'bot') {
        const botRun = Math.floor(Math.random() * 6) + 1;
        processDelivery(run, botRun);
      } else {
        if (!peerConnected) { showToast('Waiting for P2P connection'); return; }
        if (isHost) p1RunChoice = run;
        else p2RunChoice = run;

        document.getElementById('statusBanner').textContent = "Waiting for Opponent run...";
        sendP2PMessage({ type: 'MOVE', run: run });
        checkMultiplayerTurn();
      }
    }

    function checkMultiplayerTurn() {
      if (p1RunChoice !== null && p2RunChoice !== null) {
        processDelivery(p1RunChoice, p2RunChoice);
        p1RunChoice = null;
        p2RunChoice = null;
      }
    }

    function processDelivery(p1Run, p2Run) {
      drawHumanHand(document.getElementById('p1Canvas'), p1Run);
      drawHumanHand(document.getElementById('p2Canvas'), p2Run);

      if (p1Run === p2Run) {
        playSound('out');
        if (currentInnings === 1) {
          targetScore = currentScore + 1;
          showInfoModal("WICKET! OUT!", `1st Innings complete. Score: ${currentScore}. Target for 2nd Innings: ${targetScore}`, () => {
            currentInnings = 2;
            currentScore = 0;
            p1Role = p1Role === 'Batting' ? 'Bowling' : 'Batting';
            startInnings();
          });
        } else {
          evaluateGameResult(false);
        }
      } else {
        playSound('hit');
        const batsmanRun = p1Role === 'Batting' ? p1Run : p2Run;
        currentScore += batsmanRun;
        document.getElementById('scoreText').textContent = currentScore;

        if (currentInnings === 2 && currentScore >= targetScore) {
          evaluateGameResult(true);
        }
      }
    }

    function evaluateGameResult(chaseSuccessful) {
      setControlsState(false);
      let title = "";
      let msg = "";

      if (p1Role === 'Batting') { 
        if (currentScore >= targetScore) {
          title = "YOU WIN!";
          msg = `You successfully chased the target of ${targetScore}!`;
        } else {
          title = "YOU LOST!";
          msg = `You were OUT! Fell short of the target ${targetScore}.`;
        }
      } else { 
        if (currentScore >= targetScore) {
          title = "YOU LOST!";
          msg = `Opponent chased down your score of ${targetScore - 1}!`;
        } else {
          title = "YOU WIN!";
          msg = `Opponent was OUT! Failed to reach target ${targetScore}.`;
        }
      }

      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMsg').textContent = msg;

      summaryShareText = `🏏 Hand Cricket Results:\nResult: ${title}\nFinal Score: ${currentScore}\nTarget: ${targetScore || '-'}\nPlay on ClassicSchoolGames!`;
      document.getElementById('shareResultText').textContent = `${title} | Score: ${currentScore}`;

      document.getElementById('gameOverModal').style.display = 'flex';
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({ title: 'Hand Cricket Result', text: summaryShareText }).catch(() => {});
      } else {
        navigator.clipboard.writeText(summaryShareText);
        showToast('Result copied to clipboard!');
      }
    }

    function resetGame(broadcast = true) {
      currentInnings = 1;
      currentScore = 0;
      targetScore = null;
      p1RunChoice = null;
      p2RunChoice = null;
      drawHumanHand(document.getElementById('p1Canvas'), 0);
      drawHumanHand(document.getElementById('p2Canvas'), 0);
      document.getElementById('gameOverModal').style.display = 'none';

      if (gameMode === 'bot') {
        document.getElementById('tossHeading').textContent = 'Toss Time!';
        document.getElementById('tossSubtext').textContent = 'Choose Heads or Tails';
        document.getElementById('tossOptionsBox').style.display = 'flex';
        document.getElementById('tossModal').style.display = 'flex';
      } else {
        document.getElementById('tossModal').style.display = 'none';
      }

      if (broadcast && gameMode === 'room') {
        sendP2PMessage({ type: 'RESET' });
      }
    }

    // Auto-join via URL query parameter if present
    window.addEventListener('DOMContentLoaded', () => {
      renderAllHands();
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        switchMode('room');
        document.getElementById('roomCodeInput').value = roomParam;
        joinRoom();
      }
    });
  </script>
</body>
</html>
