<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Place Animal Thing - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Wooden Blackboard Frame */
    .board-frame {
      width: 100%;
      max-width: 900px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Chalkboard Surface */
    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 2rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Chalk Dust Overlay */
    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      background-color: var(--chalk-orange);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Chalk Eraser Button */
    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .chalk-link-btn {
      background: transparent;
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      color: var(--chalk-white);
      padding: 0.35rem 0.8rem;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chalk-link-btn:hover {
      color: var(--chalk-yellow);
      border-color: var(--chalk-yellow);
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }

    /* Mode & Room Controls Bar */
    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.75rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      border: 2px solid var(--chalk-dim);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--chalk-dim);
      background: transparent;
      color: var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
    }

    .toggle-btn.active {
      background: var(--chalk-orange);
      color: #17181c;
      border-color: var(--chalk-orange);
      font-weight: 700;
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .room-input {
      padding: 0.35rem 0.6rem;
      border: 2px solid var(--chalk-white);
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      width: 100px;
      text-transform: uppercase;
      outline: none;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 2px dashed var(--chalk-dim);
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      color: var(--chalk-white);
    }

    .letter-display {
      font-family: var(--font-chalk-heading);
      font-size: 2rem;
      text-align: center;
      color: var(--chalk-yellow);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .letter-display span {
      font-size: 3rem;
      color: var(--chalk-orange);
      text-transform: uppercase;
      margin-left: 0.5rem;
    }

    .timer-badge {
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      color: var(--chalk-pink);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: 100%;
    }

    @media (max-width: 600px) {
      .category-grid {
        grid-template-columns: 1fr;
      }
    }

    .category-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
    }

    .category-label {
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      color: var(--chalk-yellow);
      letter-spacing: 1px;
    }

    .category-input {
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      background: rgba(0, 0, 0, 0.25);
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.4rem;
      outline: none;
    }

    .category-input:focus {
      border-color: var(--chalk-orange);
      box-shadow: 0 0 8px var(--chalk-orange);
    }

    .submit-btn {
      grid-column: 1 / -1;
      width: 100%;
      padding: 0.85rem;
      background-color: var(--chalk-orange);
      color: #17181c;
      border: 2px solid var(--wood-inner);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      font-family: var(--font-chalk-hand);
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .submit-btn:hover {
      transform: scale(1.02);
      background-color: var(--chalk-yellow);
    }

    /* Chalkboard Modal System */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-card {
      background-color: var(--board-bg);
      border: 3px dashed var(--chalk-orange);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 450px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      font-family: var(--font-chalk-sub);
    }

    .modal-card h2 {
      font-family: var(--font-chalk-heading);
      color: var(--chalk-yellow);
      font-size: 2rem;
    }

    .modal-btn {
      padding: 0.65rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--chalk-white);
      background-color: var(--chalk-orange);
      color: #17181c;
    }

    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-chalk-sub);
      font-size: 1.1rem;
      margin: 0.5rem 0;
    }

    .breakdown-table th, .breakdown-table td {
      border: 1px dashed var(--chalk-dim);
      padding: 0.5rem;
      text-align: left;
    }

    .breakdown-table th {
      color: var(--chalk-yellow);
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
    }

    .share-box {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-white);
      padding: 0.85rem;
      border-radius: 8px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      color: var(--chalk-green);
      word-break: break-all;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #c29b68;
      color: #2b1a0e;
      border: 2px solid #5c3a21;
      padding: 0.6rem 1.4rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: none;
      z-index: 200;
    }

    /* Chalk Ledge Wooden Tray */
    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          NPAT Chalkboard
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="chalk-link-btn">← Dashboard</a>
        </div>
      </header>

      <main>
        <div class="mode-bar">
          <div class="mode-toggle">
            <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
            <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
          </div>
          <div class="room-actions" id="roomControls" style="display: none;">
            <button class="toggle-btn" onclick="createRoom()">Create Room</button>
            <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
            <button class="toggle-btn" onclick="joinRoom()">Join</button>
          </div>
        </div>

        <div class="scoreboard">
          <div>Round: <span id="roundText" style="color:var(--chalk-yellow);">1/3</span></div>
          <div class="timer-badge">⏱️ <span id="timerText">45</span>s</div>
          <div>Score: <span id="userScoreText" style="color:var(--chalk-green);">0</span> | <span id="p2LabelText">Bot</span>: <span id="botScoreText" style="color:var(--chalk-pink);">0</span></div>
        </div>

        <div class="letter-display">
          Current Letter: <span id="letterTarget">?</span>
        </div>

        <form class="category-grid" id="npatForm" onsubmit="handleFormSubmit(event)">
          <div class="category-field">
            <label class="category-label">👤 Name</label>
            <input type="text" id="inputName" class="category-input" placeholder="e.g. Alex" autocomplete="off" />
          </div>
          <div class="category-field">
            <label class="category-label">📍 Place</label>
            <input type="text" id="inputPlace" class="category-input" placeholder="e.g. America" autocomplete="off" />
          </div>
          <div class="category-field">
            <label class="category-label">🦁 Animal</label>
            <input type="text" id="inputAnimal" class="category-input" placeholder="e.g. Alligator" autocomplete="off" />
          </div>
          <div class="category-field">
            <label class="category-label">📦 Thing</label>
            <input type="text" id="inputThing" class="category-input" placeholder="e.g. Apple" autocomplete="off" />
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">STOP! Submit Entries</button>
        </form>
      </main>

      <!-- Round Summary Modal -->
      <div class="modal-overlay" id="roundModal">
        <div class="modal-card">
          <h2>ROUND SUMMARY</h2>
          <table class="breakdown-table" id="breakdownTable">
            <thead>
              <tr>
                <th>Category</th>
                <th>You</th>
                <th id="thP2Name">Bot</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody id="breakdownBody"></tbody>
          </table>
          <button class="modal-btn" onclick="nextRound()">Next Round</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="finalTitle">GAME OVER</h2>
          <p id="finalMsg" style="color:var(--chalk-white); font-size:1.1rem;"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
      <div class="chalk-piece" style="background: var(--chalk-orange);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    /* Category Word Bank for Bot */
    const DATABASE = {
      A: { name: ["ALEX", "ADAM", "ANNA"], place: ["AMERICA", "ARGENTINA", "AUSTRALIA"], animal: ["ALLIGATOR", "ANT", "APE"], thing: ["APPLE", "AXE", "ANCHOR"] },
      B: { name: ["BEN", "BRYAN", "BELLA"], place: ["BRAZIL", "BERLIN", "BELGIUM"], animal: ["BEAR", "BIRD", "BEE"], thing: ["BALL", "BOOK", "BOX"] },
      C: { name: ["CHRIS", "CHARLIE", "CLARA"], place: ["CANADA", "CHINA", "CUBA"], animal: ["CAT", "COW", "CAMEL"], thing: ["CAR", "CHAIR", "CLOCK"] },
      D: { name: ["DAVID", "DAN", "DIANA"], place: ["DENMARK", "DUBAI", "DELHI"], animal: ["DOG", "DEER", "DUCK"], thing: ["DOOR", "DESK", "DRUM"] },
      E: { name: ["ERIC", "EMMA", "ETHAN"], place: ["EGYPT", "ENGLAND", "ESTONIA"], animal: ["ELEPHANT", "EAGLE", "ELK"], thing: ["EGG", "ERASER", "ENGINE"] },
      F: { name: ["FRANK", "FIONA", "FELIX"], place: ["FRANCE", "FINLAND", "FIJI"], animal: ["FOX", "FROG", "FISH"], thing: ["FAN", "FORK", "FEATHER"] },
      G: { name: ["GEORGE", "GRACE", "GABRIEL"], place: ["GERMANY", "GREECE", "GEORGIA"], animal: ["GIRAFFE", "GOAT", "GORILLA"], thing: ["GLASS", "GUITAR", "GLOVES"] },
      H: { name: ["HARRY", "HANNAH", "HENRY"], place: ["HUNGARY", "HAWAII", "HAITI"], animal: ["HORSE", "HIPPO", "HAWK"], thing: ["HAT", "HAMMER", "HELMET"] },
      I: { name: ["IAN", "ISABELLA", "IVAN"], place: ["INDIA", "ITALY", "ICELAND"], animal: ["IGUANA", "IMPALA", "INSECT"], thing: ["INK", "IRON", "ICE"] },
      J: { name: ["JACK", "JOHN", "JULIA"], place: ["JAPAN", "JAMAICA", "JORDAN"], animal: ["JAGUAR", "JELLYFISH", "JACKAL"], thing: ["JAR", "JACKET", "JUG"] },
      K: { name: ["KEVIN", "KATE", "KENNY"], place: ["KENYA", "KOREA", "KUWAIT"], animal: ["KANGAROO", "KOALA", "KINGFISHER"], thing: ["KEY", "KITE", "KNIFE"] },
      L: { name: ["LEO", "LUCY", "LUKE"], place: ["LONDON", "LAOS", "LIBYA"], animal: ["LION", "LEOPARD", "LIZARD"], thing: ["LAMP", "LOCK", "LEAF"] },
      M: { name: ["MARK", "MARY", "MIKE"], place: ["MEXICO", "MADRID", "MUMBAI"], animal: ["MONKEY", "MOUSE", "MOOSE"], thing: ["MAP", "MIRROR", "MAGNET"] },
      N: { name: ["NICK", "NINA", "NOAH"], place: ["NEPAL", "NORWAY", "NIGERIA"], animal: ["NEWT", "NIGHTINGALE", "NARWHAL"], thing: ["NOTEBOOK", "NEEDLE", "NET"] },
      O: { name: ["OLIVER", "OLIVIA", "OWEN"], place: ["OMAN", "OHIO", "OSLO"], animal: ["OWL", "OSTRICH", "OCTOPUS"], thing: ["OVEN", "OIL", "ORGAN"] },
      P: { name: ["PAUL", "PETER", "PENNY"], place: ["PARIS", "PERU", "POLAND"], animal: ["PANDA", "PARROT", "PIG"], thing: ["PEN", "PENCIL", "PAPER"] },
      R: { name: ["RYAN", "ROSE", "RICK"], place: ["ROME", "RUSSIA", "ROMANIA"], animal: ["RABBIT", "RAT", "RHINO"], thing: ["RING", "ROPE", "RADIO"] },
      S: { name: ["SAM", "SARAH", "STEVE"], place: ["SPAIN", "SWEDEN", "SEOUL"], animal: ["SNAKE", "SHARK", "SEAL"], thing: ["SPOON", "SHOES", "SOAP"] },
      T: { name: ["TOM", "TINA", "TYLER"], place: ["TOKYO", "TEXAS", "TURKEY"], animal: ["TIGER", "TURTLE", "TOAD"], thing: ["TABLE", "TELEPHONE", "TOY"] }
    };

    /* Web Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      } else if (type === 'finish') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    /* Chalkboard Theme Engine */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }

    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    /* Game State Variables */
    let currentRound = 1;
    const maxRounds = 3;
    let currentLetter = "";
    let userTotalScore = 0;
    let botTotalScore = 0;
    let timer = 45;
    let timerInterval = null;
    let gameMode = 'bot';
    let roomChannel = null;
    let currentRoomCode = '';
    let isHost = false;
    let p1SubmittedInputs = null;
    let p2SubmittedInputs = null;
    let summaryShareText = '';

    const availableLetters = Object.keys(DATABASE);

    function switchMode(mode) {
      gameMode = mode;
      document.getElementById('modeBotBtn').classList.toggle('active', mode === 'bot');
      document.getElementById('modeRoomBtn').classList.toggle('active', mode === 'room');
      document.getElementById('roomControls').style.display = mode === 'room' ? 'flex' : 'none';
      document.getElementById('p2LabelText').textContent = mode === 'bot' ? 'Bot' : 'P2';
      document.getElementById('thP2Name').textContent = mode === 'bot' ? 'Bot' : 'P2';
      resetGame();
    }

    function createRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('roomCodeInput').value = code;
      initRoom(code, true);
      showToast(`Room Created: ${code}`);
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { showToast('Enter room code'); return; }
      initRoom(code, false);
      showToast(`Joined Room: ${code}`);
    }

    function initRoom(code, host) {
      if (roomChannel) roomChannel.close();
      currentRoomCode = code;
      isHost = host;
      roomChannel = new BroadcastChannel(`npat_room_${code}`);

      roomChannel.onmessage = (e) => {
        const data = e.data;
        if (data.type === 'LETTER' && !isHost) {
          currentLetter = data.letter;
          setupRoundUI();
        } else if (data.type === 'SUBMIT') {
          if (isHost) p2SubmittedInputs = data.inputs;
          else p1SubmittedInputs = data.inputs;
          checkMultiplayerRound();
        } else if (data.type === 'RESET') {
          resetGame(false);
        }
      };
      resetGame(false);
    }

    function startRound() {
      if (gameMode === 'bot' || isHost) {
        currentLetter = availableLetters[Math.floor(Math.random() * availableLetters.length)];
        if (roomChannel) roomChannel.postMessage({ type: 'LETTER', letter: currentLetter });
      }
      setupRoundUI();
    }

    function setupRoundUI() {
      document.getElementById('letterTarget').textContent = currentLetter || '?';
      document.getElementById('roundText').textContent = `${currentRound}/${maxRounds}`;

      document.getElementById('inputName').value = "";
      document.getElementById('inputPlace').value = "";
      document.getElementById('inputAnimal').value = "";
      document.getElementById('inputThing').value = "";

      timer = 45;
      document.getElementById('timerText').textContent = timer;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('timerText').textContent = timer;
        if (timer <= 5 && timer > 0) playSound('tick');
        if (timer <= 0) {
          clearInterval(timerInterval);
          submitRound();
        }
      }, 1000);
    }

    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      submitRound();
    }

    function submitRound() {
      clearInterval(timerInterval);
      playSound('finish');

      const userInputs = {
        name: document.getElementById('inputName').value.trim().toUpperCase(),
        place: document.getElementById('inputPlace').value.trim().toUpperCase(),
        animal: document.getElementById('inputAnimal').value.trim().toUpperCase(),
        thing: document.getElementById('inputThing').value.trim().toUpperCase()
      };

      if (gameMode === 'bot') {
        const botData = DATABASE[currentLetter];
        const botInputs = {
          name: botData.name[Math.floor(Math.random() * botData.name.length)],
          place: botData.place[Math.floor(Math.random() * botData.place.length)],
          animal: botData.animal[Math.floor(Math.random() * botData.animal.length)],
          thing: botData.thing[Math.floor(Math.random() * botData.thing.length)]
        };
        evaluateRound(userInputs, botInputs);
      } else {
        if (isHost) p1SubmittedInputs = userInputs;
        else p2SubmittedInputs = userInputs;

        if (roomChannel) {
          roomChannel.postMessage({ type: 'SUBMIT', inputs: userInputs });
        }
        checkMultiplayerRound();
      }
    }

    function checkMultiplayerRound() {
      if (p1SubmittedInputs && p2SubmittedInputs) {
        evaluateRound(p1SubmittedInputs, p2SubmittedInputs);
        p1SubmittedInputs = null;
        p2SubmittedInputs = null;
      }
    }

    function evaluateRound(uInputs, bInputs) {
      const categories = ['name', 'place', 'animal', 'thing'];
      let roundUserScore = 0;
      let roundBotScore = 0;
      const breakdownBody = document.getElementById('breakdownBody');
      breakdownBody.innerHTML = "";

      categories.forEach(cat => {
        const uVal = uInputs[cat];
        const bVal = bInputs[cat];

        let uPts = 0;
        let bPts = 0;

        const uValid = uVal.length > 0 && uVal[0] === currentLetter;
        const bValid = bVal.length > 0 && bVal[0] === currentLetter;

        if (uValid && bValid) {
          if (uVal === bVal) {
            uPts = 5;
            bPts = 5;
          } else {
            uPts = 10;
            bPts = 10;
          }
        } else if (uValid && !bValid) {
          uPts = 10;
          bPts = 0;
        } else if (!uValid && bValid) {
          uPts = 0;
          bPts = 10;
        }

        roundUserScore += uPts;
        roundBotScore += bPts;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:700; text-transform:capitalize; color:var(--chalk-yellow);">${cat}</td>
          <td>${uVal || '-'} (${uPts}p)</td>
          <td>${bVal || '-'} (${bPts}p)</td>
          <td style="color:var(--chalk-green);">${uPts} / ${bPts}</td>
        `;
        breakdownBody.appendChild(tr);
      });

      userTotalScore += roundUserScore;
      botTotalScore += roundBotScore;

      document.getElementById('userScoreText').textContent = userTotalScore;
      document.getElementById('botScoreText').textContent = botTotalScore;

      document.getElementById('roundModal').style.display = 'flex';
    }

    function nextRound() {
      document.getElementById('roundModal').style.display = 'none';
      if (currentRound < maxRounds) {
        currentRound++;
        startRound();
      } else {
        let title = "";
        let msg = "";

        if (userTotalScore > botTotalScore) {
          title = "YOU WIN!";
          msg = `Final Score: You (${userTotalScore}) - Opponent (${botTotalScore})`;
        } else if (userTotalScore < botTotalScore) {
          title = "YOU LOST!";
          msg = `Final Score: You (${userTotalScore}) - Opponent (${botTotalScore})`;
        } else {
          title = "IT'S A TIE!";
          msg = `Both scored ${userTotalScore} points!`;
        }

        document.getElementById('finalTitle').textContent = title;
        document.getElementById('finalMsg').textContent = msg;

        summaryShareText = `✏️ Name Place Animal Thing Results:\nResult: ${title}\nYour Score: ${userTotalScore}\nOpponent: ${botTotalScore}\nPlay on ClassicSchoolGames!`;
        document.getElementById('shareResultText').textContent = `${title} | You: ${userTotalScore} - Opponent: ${botTotalScore}`;

        document.getElementById('gameOverModal').style.display = 'flex';
      }
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({ title: 'NPAT Game Result', text: summaryShareText }).catch(() => {});
      } else {
        navigator.clipboard.writeText(summaryShareText);
        showToast('Result copied to clipboard!');
      }
    }

    function resetGame(broadcast = true) {
      currentRound = 1;
      userTotalScore = 0;
      botTotalScore = 0;
      p1SubmittedInputs = null;
      p2SubmittedInputs = null;
      document.getElementById('userScoreText').textContent = "0";
      document.getElementById('botScoreText').textContent = "0";
      document.getElementById('gameOverModal').style.display = 'none';
      if (broadcast && roomChannel) {
        roomChannel.postMessage({ type: 'RESET' });
      }
      startRound();
    }

    startRound();
  </script>
</body>
</html>
