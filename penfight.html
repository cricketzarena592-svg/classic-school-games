<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Fighter - ClassicSchoolGames</title>
  <!-- PeerJS CDN for WebRTC Multiplayer Room Codes -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- School Chalk & Handwriting Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Wooden Blackboard Frame Outer Container */
    .board-frame {
      width: 100%;
      max-width: 1100px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Chalkboard Surface */
    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 1.75rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Chalk Dust Overlay */
    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4), 0 0 2px var(--chalk-white);
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      background-color: var(--chalk-yellow);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Eraser Theme Button */
    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .chalk-btn {
      background: transparent;
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      color: var(--chalk-white);
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .chalk-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }

    /* Game Wrapper */
    .game-card-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .status-panel {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      font-family: var(--font-chalk-hand);
      font-size: 1.4rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .room-badge {
      border: 1.5px dashed var(--chalk-pink);
      color: var(--chalk-pink);
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-size: 1.1rem;
      margin-left: 0.5rem;
    }

    #turnStatus {
      color: var(--chalk-yellow);
      text-shadow: 0 0 3px var(--chalk-yellow);
    }

    .panel-controls {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--chalk-white);
      border: 2px solid var(--chalk-green);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(168, 255, 178, 0.2);
      transform: scale(1.04);
    }

    /* Desk Canvas Frame */
    #gameCanvas {
      background-color: #ba8c59;
      border: 10px solid #523821;
      border-radius: 8px;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5), 0 10px 20px rgba(0,0,0,0.5);
      cursor: crosshair;
      touch-action: none;
      max-width: 100%;
    }

    .instructions {
      font-family: var(--font-chalk-sub);
      font-size: 1.1rem;
      color: var(--chalk-white);
      opacity: 0.9;
      text-align: center;
    }

    /* Chalk Style Modals */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border: 3px dashed var(--chalk-yellow);
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-family: var(--font-chalk-heading);
      font-size: 2rem;
      color: var(--chalk-yellow);
      letter-spacing: 2px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
    }

    .form-group label {
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      color: var(--chalk-white);
    }

    .form-group select, .form-group input {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      border: 2px solid var(--chalk-white);
      background: rgba(0, 0, 0, 0.3);
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .modal-btn {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      cursor: pointer;
      border: 2px solid var(--chalk-white);
      background: transparent;
      color: var(--chalk-white);
      transition: all 0.2s ease;
    }

    .primary-btn {
      border-color: var(--chalk-green);
      color: var(--chalk-green);
    }

    .primary-btn:hover {
      background: rgba(168, 255, 178, 0.2);
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Wooden Tray at Bottom Frame */
    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Wooden Frame Outer Container -->
  <div class="board-frame">
    <!-- Green Chalkboard Main Container -->
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="chalk-btn">← Dashboard</a>
        </div>
      </header>

      <div class="game-card-wrapper">
        <div class="status-panel">
          <div>
            <span id="turnStatus">Player 1's Turn</span>
            <span class="room-badge" id="roomCodeDisplay">Local Lobby</span>
          </div>
          <div class="panel-controls">
            <button class="action-btn" id="customizeBtn" style="border-color: var(--chalk-pink);">🖋️ Loadout & Mode</button>
            <button class="action-btn" id="roomBtn" style="border-color: var(--chalk-blue);">🌐 Room Code</button>
            <button class="action-btn" id="resetBtn" style="border-color: var(--chalk-yellow);">Reset Desk</button>
          </div>
        </div>

        <canvas id="gameCanvas" width="850" height="480"></canvas>

        <p class="instructions">
          ✏️ Drag back on your active pen to set flick force & trajectory. Last pen on table wins!
        </p>

        <!-- Game Over Modal -->
        <div class="modal-overlay" id="gameOverModal">
          <div class="modal-card">
            <h2 class="modal-title" id="modalHeaderTitle">GAME OVER</h2>
            <p id="winnerText" style="color: var(--chalk-white); font-size: 1.2rem; font-family: var(--font-chalk-hand);"></p>
            <div class="modal-actions">
              <button class="modal-btn primary-btn" id="playAgainBtn">Play Again</button>
              <button class="modal-btn secondary-btn" id="shareResultBtn">Share Result</button>
            </div>
          </div>
        </div>

        <!-- Pen Customization Modal -->
        <div class="modal-overlay" id="customizationModal">
          <div class="modal-card">
            <h2 class="modal-title">Customization & Mode</h2>
            <div class="form-group">
              <label>Pen Cap Style</label>
              <select id="penCapSelect">
                <option value="standard">Standard Cap (Balanced)</option>
                <option value="heavy">Heavy Gel Cap (+Mass, -Speed)</option>
                <option value="aerodynamic">Needle Tip (+Speed, -Mass)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Pen Color</label>
              <input type="color" id="penColorInput" value="#0055ff">
            </div>
            <div class="form-group">
              <label>Players Count</label>
              <select id="gameModeSelect">
                <option value="2p">2 Players Pass & Play</option>
                <option value="3p">3 Players Free-For-All</option>
                <option value="4p">4 Players Free-For-All</option>
              </select>
            </div>
            <div class="modal-actions">
              <button class="modal-btn primary-btn" id="saveCustomizationBtn">Save & Reset Desk</button>
            </div>
          </div>
        </div>

        <!-- Room Code Modal -->
        <div class="modal-overlay" id="roomModal">
          <div class="modal-card">
            <h2 class="modal-title">Live Multiplayer Room</h2>
            <p style="font-size:1rem; color:var(--chalk-white); font-family: var(--font-chalk-sub);">Enter a room code or host a new room to play live across devices!</p>
            <div class="form-group">
              <label>Room Code</label>
              <input type="text" id="roomCodeInput" placeholder="e.g. DESK99" style="text-transform:uppercase;">
            </div>
            <div class="modal-actions">
              <button class="modal-btn secondary-btn" id="hostRoomBtn">Host Room</button>
              <button class="modal-btn primary-btn" id="joinRoomBtn">Join Room</button>
            </div>
            <button class="modal-btn secondary-btn" id="closeRoomBtn" style="margin-top:0.5rem;">Close</button>
          </div>
        </div>

      </div>

    </div>

    <!-- Decorative Chalk Tray -->
    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
    </div>
  </div>

  <script>
    /* Web Audio API Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playFlickSound(power) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120 + power * 15, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playHitSound(impact) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(80 + Math.min(impact * 10, 200), audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playOutSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    }

    /* Eraser Theme Controls */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }

    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    /* Pen Class & Rendering */
    class Pen {
      constructor(x, y, angle, color, name, id, capStyle = 'standard') {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.angle = angle;
        this.va = 0;
        this.length = 130;
        this.width = 14;
        this.color = color;
        this.name = name;
        this.id = id;
        this.radius = 28;
        this.capStyle = capStyle;
        this.isEliminated = false;

        this.mass = capStyle === 'heavy' ? 1.4 : capStyle === 'aerodynamic' ? 0.8 : 1.0;
        this.friction = capStyle === 'aerodynamic' ? 0.975 : 0.965;
      }

      update() {
        if (this.isEliminated) return;
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.va;

        this.vx *= this.friction;
        this.vy *= this.friction;
        this.va *= 0.88;

        if (Math.hypot(this.vx, this.vy) < 0.08) { this.vx = 0; this.vy = 0; }
        if (Math.abs(this.va) < 0.001) this.va = 0;
      }

      draw(ctx) {
        if (this.isEliminated) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        const halfL = this.length / 2;
        const halfW = this.width / 2;

        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.beginPath();
        ctx.roundRect(-halfL + 5, -halfW + 5, this.length, this.width, 4);
        ctx.fill();

        // Main Barrel
        ctx.fillStyle = 'rgba(240, 240, 255, 0.85)';
        ctx.strokeStyle = 'rgba(180, 180, 200, 0.8)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(-halfL, -halfW, this.length - 25, this.width, 3);
        ctx.fill();
        ctx.stroke();

        // Ink Tube
        ctx.fillStyle = this.color;
        ctx.fillRect(-halfL + 10, -2, this.length - 45, 4);

        // Metallic Tip
        ctx.fillStyle = '#d0d0d5';
        ctx.beginPath();
        ctx.moveTo(halfL - 25, -halfW);
        ctx.lineTo(halfL - 8, -2.5);
        ctx.lineTo(halfL - 8, 2.5);
        ctx.lineTo(halfL - 25, halfW);
        ctx.closePath();
        ctx.fill();

        // Visible Pen Caps
        if (this.capStyle === 'heavy') {
          ctx.fillStyle = '#111';
          ctx.fillRect(-halfL - 12, -halfW - 3, 30, this.width + 6);
          ctx.fillStyle = this.color;
          ctx.fillRect(-halfL + 8, -halfW - 5, 8, this.width + 10);
        } else if (this.capStyle === 'aerodynamic') {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(-halfL + 20, -halfW - 2);
          ctx.lineTo(-halfL - 18, 0);
          ctx.lineTo(-halfL + 20, halfW + 2);
          ctx.closePath();
          ctx.fill();
        } else {
          // Standard Cap
          ctx.fillStyle = this.color;
          ctx.fillRect(-halfL - 8, -halfW - 1, 28, this.width + 2);
          ctx.fillStyle = '#a0a0a5';
          ctx.fillRect(-halfL + 2, -halfW - 4, 16, 3);
        }

        ctx.restore();
      }

      isOffTable(width, height) {
        return (this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20);
      }
    }

    /* Core Game State */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const turnStatus = document.getElementById('turnStatus');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    
    let pens = [];
    let turnIndex = 0;
    let isDragging = false;
    let dragStart, dragCurrent, gameOver = false, lastMatchResult = '';
    let gameMode = '2p';

    /* PeerJS Connectivity */
    let peer = null, peerConn = null;

    function initDesk() {
      pens = [];
      const userColor = document.getElementById('penColorInput').value;
      const userCap = document.getElementById('penCapSelect').value;

      // Extract player name from URL query parameter if present
      const urlParams = new URLSearchParams(window.location.search);
      const userName = urlParams.get('user') || localStorage.getItem('csg_username') || 'Player 1';

      if (gameMode === '3p') {
        pens.push(new Pen(200, 150, 0, userColor, userName, 1, userCap));
        pens.push(new Pen(650, 150, Math.PI, '#ff3333', 'Player 2', 2));
        pens.push(new Pen(425, 380, -Math.PI / 2, '#33cc66', 'Player 3', 3));
      } else if (gameMode === '4p') {
        pens.push(new Pen(180, 140, 0, userColor, userName, 1, userCap));
        pens.push(new Pen(670, 140, Math.PI, '#ff3333', 'Player 2', 2));
        pens.push(new Pen(180, 340, 0, '#33cc66', 'Player 3', 3));
        pens.push(new Pen(670, 340, Math.PI, '#ff9900', 'Player 4', 4));
      } else {
        pens.push(new Pen(180, 240, 0, userColor, userName, 1, userCap));
        pens.push(new Pen(670, 240, Math.PI, '#ff3333', 'Player 2', 2));
      }

      turnIndex = 0;
      isDragging = false;
      gameOver = false;
      document.getElementById('gameOverModal').style.display = 'none';
      updateTurnUI();
    }

    function isMoving() {
      return pens.some(p => Math.hypot(p.vx, p.vy) > 0.1);
    }

    function updateTurnUI() {
      if (gameOver) return;
      const active = pens[turnIndex];
      turnStatus.textContent = `${active.name}'s Turn`;
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrag(e) {
      if (gameOver || isMoving()) return;
      const activePen = pens[turnIndex];

      const pos = getMousePos(e);
      if (Math.hypot(pos.x - activePen.x, pos.y - activePen.y) < 60) {
        isDragging = true;
        dragStart = { x: activePen.x, y: activePen.y };
        dragCurrent = pos;
      }
    }

    function moveDrag(e) {
      if (isDragging) dragCurrent = getMousePos(e);
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;

      const activePen = pens[turnIndex];
      const dx = dragStart.x - dragCurrent.x;
      const dy = dragStart.y - dragCurrent.y;
      const pullDist = Math.hypot(dx, dy);

      if (pullDist > 8) {
        const power = Math.min(pullDist * 0.18, 18);
        const angle = Math.atan2(dy, dx);

        activePen.vx = Math.cos(angle) * power;
        activePen.vy = Math.sin(angle) * power;
        activePen.angle = angle;
        activePen.va = (Math.random() - 0.5) * 0.04;

        playFlickSound(power);
        broadcastMove({ penId: activePen.id, vx: activePen.vx, vy: activePen.vy, angle: activePen.angle, va: activePen.va });
        nextTurn();
      }
    }

    function nextTurn() {
      do {
        turnIndex = (turnIndex + 1) % pens.length;
      } while (pens[turnIndex].isEliminated && activeCount() > 1);
      updateTurnUI();
    }

    function activeCount() {
      return pens.filter(p => !p.isEliminated).length;
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', (e) => { startDrag(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { moveDrag(e); e.preventDefault(); });
    window.addEventListener('touchend', endDrag);

    function handleCollisions() {
      for (let i = 0; i < pens.length; i++) {
        for (let j = i + 1; j < pens.length; j++) {
          const p1 = pens[i];
          const p2 = pens[j];
          if (p1.isEliminated || p2.isEliminated) continue;

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = p1.radius + p2.radius;

          if (dist < minDist && dist > 0) {
            const angle = Math.atan2(dy, dx);
            const overlap = minDist - dist;

            p1.x -= Math.cos(angle) * overlap * 0.5;
            p1.y -= Math.sin(angle) * overlap * 0.5;
            p2.x += Math.cos(angle) * overlap * 0.5;
            p2.y += Math.sin(angle) * overlap * 0.5;

            const totalSpeed = (Math.hypot(p1.vx, p1.vy) + Math.hypot(p2.vx, p2.vy)) * 0.82;
            playHitSound(totalSpeed);

            p1.vx = -Math.cos(angle) * (totalSpeed / p1.mass + 2);
            p1.vy = -Math.sin(angle) * (totalSpeed / p1.mass + 2);
            p2.vx = Math.cos(angle) * (totalSpeed / p2.mass + 2);
            p2.vy = Math.sin(angle) * (totalSpeed / p2.mass + 2);
          }
        }
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      pens.forEach(p => p.update());
      handleCollisions();
      pens.forEach(p => p.draw(ctx));

      if (isDragging) {
        const activePen = pens[turnIndex];
        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;

        ctx.beginPath();
        ctx.moveTo(activePen.x, activePen.y);
        ctx.lineTo(activePen.x + dx, activePen.y + dy);
        ctx.strokeStyle = '#fff3a0';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (!gameOver) {
        pens.forEach(p => {
          if (!p.isEliminated && p.isOffTable(canvas.width, canvas.height)) {
            p.isEliminated = true;
            playOutSound();
          }
        });

        if (activeCount() <= 1) {
          gameOver = true;
          const winner = pens.find(p => !p.isEliminated);
          const title = winner ? `${winner.name} WINS!` : "DRAW!";
          lastMatchResult = winner ? `${winner.name} survived the desk!` : "Everyone fell off!";
          document.getElementById('modalHeaderTitle').textContent = title;
          document.getElementById('winnerText').textContent = lastMatchResult;
          document.getElementById('gameOverModal').style.display = 'flex';
        }
      }

      requestAnimationFrame(gameLoop);
    }

    /* WebRTC Live Multiplayer Sync */
    function broadcastMove(data) {
      if (peerConn && peerConn.open) {
        peerConn.send({ type: 'MOVE', data: data });
      }
    }

    document.getElementById('hostRoomBtn').onclick = () => {
      const code = 'DESK-' + Math.floor(100 + Math.random() * 900);
      document.getElementById('roomCodeInput').value = code;
      peer = new Peer(code);
      peer.on('open', (id) => {
        roomCodeDisplay.textContent = `Room: ${id}`;
        document.getElementById('roomModal').style.display = 'none';
      });
      peer.on('connection', (conn) => {
        peerConn = conn;
        setupPeerListeners();
      });
    };

    document.getElementById('joinRoomBtn').onclick = () => {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) return;
      peer = new Peer();
      peer.on('open', () => {
        peerConn = peer.connect(code);
        setupPeerListeners();
        roomCodeDisplay.textContent = `Room: ${code}`;
        document.getElementById('roomModal').style.display = 'none';
      });
    };

    function setupPeerListeners() {
      peerConn.on('data', (msg) => {
        if (msg.type === 'MOVE') {
          const targetPen = pens.find(p => p.id === msg.data.penId);
          if (targetPen) {
            targetPen.vx = msg.data.vx;
            targetPen.vy = msg.data.vy;
            targetPen.angle = msg.data.angle;
            targetPen.va = msg.data.va;
            playFlickSound(Math.hypot(msg.data.vx, msg.data.vy));
            nextTurn();
          }
        }
      });
    }

    /* Modals & UI Event Handlers */
    document.getElementById('customizeBtn').onclick = () => document.getElementById('customizationModal').style.display = 'flex';
    document.getElementById('saveCustomizationBtn').onclick = () => {
      gameMode = document.getElementById('gameModeSelect').value;
      document.getElementById('customizationModal').style.display = 'none';
      initDesk();
    };

    document.getElementById('roomBtn').onclick = () => document.getElementById('roomModal').style.display = 'flex';
    document.getElementById('closeRoomBtn').onclick = () => document.getElementById('roomModal').style.display = 'none';

    document.getElementById('resetBtn').onclick = initDesk;
    document.getElementById('playAgainBtn').onclick = initDesk;

    document.getElementById('shareResultBtn').onclick = () => {
      const shareData = `🖊️ Pen Fighter Result:\nOutcome: ${lastMatchResult}\nPlayed on ClassicSchoolGames!`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareData);
        document.getElementById('shareResultBtn').textContent = "Copied!";
        setTimeout(() => document.getElementById('shareResultBtn').textContent = "Share Result", 2000);
      }
    };

    initDesk();
    gameLoop();
  </script>
</body>
</html>
