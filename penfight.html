<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Fighter - ClassicSchoolGames</title>
  <!-- PeerJS CDN for WebRTC Multiplayer Room Codes -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- School Chalk & Handwriting Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="frontend/css/penfight.css">
</head>
<body>

  <!-- Wooden Frame Outer Container -->
  <div class="board-frame">
    <!-- Green Chalkboard Main Container -->
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          Pen Fighter
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="game-card-wrapper">
        <div class="status-panel">
          <div>
            <span id="turnStatus">Player 1's Turn</span>
            <span class="room-badge" id="roomCodeDisplay">Local Pass & Play</span>
          </div>
          <div class="panel-controls">
            <button class="action-btn" id="customizeBtn" style="border-color: var(--chalk-pink);">🖋️ Loadout & Mode</button>
            <button class="action-btn" id="roomBtn" style="border-color: var(--chalk-blue);">🌐 Live Room Code</button>
            <button class="action-btn" id="resetBtn" style="border-color: var(--chalk-yellow);">Reset Desk</button>
          </div>
        </div>

        <canvas id="gameCanvas" width="850" height="480"></canvas>

        <p class="instructions">
          ✏️ Drag back on your active pen to set flick force & trajectory. Last pen on table wins!
        </p>

        <!-- Game Over Modal -->
        <div class="modal-overlay" id="gameOverModal">
          <div class="modal-card">
            <h2 class="modal-title" id="modalHeaderTitle">GAME OVER</h2>
            <p id="winnerText" style="color: var(--chalk-white); font-size: 1.2rem; font-family: var(--font-chalk-hand);"></p>
            <div class="modal-actions">
              <button class="modal-btn primary-btn" id="playAgainBtn">Play Again</button>
              <button class="modal-btn secondary-btn" id="shareResultBtn">Share Result</button>
            </div>
          </div>
        </div>

        <!-- Pen Customization Modal -->
        <div class="modal-overlay" id="customizationModal">
          <div class="modal-card">
            <h2 class="modal-title">Customization & Mode</h2>
            <div class="form-group">
              <label>Pen Cap Style</label>
              <select id="penCapSelect">
                <option value="standard">Standard Cap (Balanced)</option>
                <option value="heavy">Heavy Gel Cap (+Mass, -Speed)</option>
                <option value="aerodynamic">Needle Tip (+Speed, -Mass)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Pen Color</label>
              <input type="color" id="penColorInput" value="#0055ff">
            </div>
            <div class="form-group">
              <label>Players Count (Local Mode)</label>
              <select id="gameModeSelect">
                <option value="2p">2 Players Pass & Play</option>
                <option value="3p">3 Players Free-For-All</option>
                <option value="4p">4 Players Free-For-All</option>
              </select>
            </div>
            <div class="modal-actions">
              <button class="modal-btn primary-btn" id="saveCustomizationBtn">Save & Reset Desk</button>
            </div>
          </div>
        </div>

        <!-- Room Code Modal -->
        <div class="modal-overlay" id="roomModal">
          <div class="modal-card">
            <h2 class="modal-title">Live Multiplayer Room</h2>
            <p style="font-size:1rem; color:var(--chalk-white); font-family: var(--font-chalk-sub);">Enter a room code or host a new room to play live across devices!</p>
            <div class="form-group">
              <label>Room Code</label>
              <input type="text" id="roomCodeInput" placeholder="e.g. PF99" style="text-transform:uppercase;" maxlength="6">
            </div>
            <div class="modal-actions">
              <button class="modal-btn secondary-btn" id="hostRoomBtn">Host Room</button>
              <button class="modal-btn primary-btn" id="joinRoomBtn">Join Room</button>
            </div>
            <button class="modal-btn secondary-btn" id="closeRoomBtn" style="margin-top:0.5rem;">Close</button>
          </div>
        </div>

      </div>

    </div>

    <!-- Decorative Chalk Tray -->
    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied!</div>

  <script src="frontend/js/penfight.js"></script>
</body>
</html>
