<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .board-frame {
      width: 100%;
      max-width: 800px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 1.75rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4), 0 0 2px var(--chalk-white);
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      background-color: var(--chalk-blue);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.6rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      border: 2px solid var(--chalk-dim);
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--chalk-white);
      background: transparent;
      color: var(--chalk-white);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .toggle-btn.active {
      background: var(--chalk-blue);
      color: #1a1a1a;
      border-color: var(--chalk-blue);
      text-shadow: none;
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .room-input {
      padding: 0.3rem 0.6rem;
      border: 2px solid var(--chalk-blue);
      border-radius: 6px;
      background: transparent;
      color: var(--chalk-blue);
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      font-weight: 700;
      width: 90px;
      text-transform: uppercase;
      outline: none;
      user-select: text;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px dashed var(--chalk-dim);
      font-family: var(--font-chalk-hand);
      font-size: 1.25rem;
      color: var(--chalk-yellow);
      position: relative;
      z-index: 2;
    }

    .target-letter-banner {
      font-family: var(--font-chalk-hand);
      font-size: 1.5rem;
      text-align: center;
      color: var(--chalk-white);
      position: relative;
      z-index: 2;
    }

    .target-letter-banner span {
      color: var(--chalk-blue);
      font-size: 2.2rem;
      font-family: var(--font-chalk-heading);
      text-shadow: 0 0 4px var(--chalk-blue);
    }

    .history-box {
      width: 100%;
      height: 200px;
      border: 2px solid var(--chalk-dim);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 0.85rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 2;
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: 1px dashed rgba(255,255,255,0.2);
      font-family: var(--font-chalk-sub);
      font-size: 1.15rem;
    }

    .entry-player { font-family: var(--font-chalk-hand); font-weight: 700; color: var(--chalk-yellow); }
    .entry-word { font-family: var(--font-chalk-hand); color: var(--chalk-green); text-transform: capitalize; }

    .input-form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .place-input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      outline: none;
      user-select: text;
    }

    .place-input:focus {
      border-color: var(--chalk-blue);
      box-shadow: 0 0 8px var(--chalk-blue);
    }

    .submit-btn {
      padding: 0.6rem 1.25rem;
      background-color: var(--chalk-blue);
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0px rgba(0,0,0,0.5);
    }

    .submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }

    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--board-bg);
      border: 3px dashed var(--chalk-white);
      border-radius: 12px;
      padding: 1.75rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      color: var(--chalk-white);
    }

    .modal-card h2 {
      font-family: var(--font-chalk-heading);
      color: var(--chalk-yellow);
      font-size: 2rem;
    }

    .modal-btn {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-family: var(--font-chalk-hand);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      background-color: var(--chalk-blue);
      color: #1a1a1a;
    }

    .share-box {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-dim);
      padding: 0.85rem;
      border-radius: 8px;
      font-family: var(--font-chalk-sub);
      font-size: 1rem;
      word-break: break-all;
      color: var(--chalk-green);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--board-bg);
      color: var(--chalk-yellow);
      border: 2px solid var(--chalk-yellow);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="copyRoomCode()">Copy Code</button>
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
        </div>
      </div>

      <div class="scoreboard">
        <div>Turn: <span id="turnText" style="color:var(--chalk-white);">Your Turn</span></div>
        <div>Places Used: <span id="countText" style="color:var(--chalk-white);">0</span></div>
      </div>

      <div class="target-letter-banner" id="letterBanner">
        Start the game with any place name!
      </div>

      <div class="history-box" id="historyBox"></div>

      <form class="input-form" id="atlasForm" onsubmit="handlePlayerSubmit(event)">
        <input type="text" id="placeInput" class="place-input" placeholder="Type a country, city, or state..." autocomplete="off" required />
        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      </form>

      <!-- Info Modal -->
      <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
          <h2 id="infoTitle">NOTICE</h2>
          <p id="infoMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <button class="modal-btn" onclick="closeInfoModal()">OK</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
      <div class="chalk-piece" style="background: var(--chalk-green);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    /* Pre-populated Place Database */
    const PLACES = [
      "AFGHANISTAN", "ALBANIA", "ALGERIA", "ANDORRA", "ANGOLA", "ARGENTINA", "ARMENIA", "AUSTRALIA", "AUSTRIA", "AZERBAIJAN",
      "BAHAMAS", "BAHRAIN", "BANGLADESH", "BARBADOS", "BELGIUM", "BELIZE", "BENIN", "BHUTAN", "BOLIVIA", "BOTSWANA", "BRAZIL",
      "BULGARIA", "CAMBODIA", "CAMEROON", "CANADA", "CHILE", "CHINA", "COLOMBIA", "CONGO", "CROATIA", "CUBA", "CYPRUS", "CZECHIA",
      "DENMARK", "DJIBOUTI", "DOMINICA", "ECUADOR", "EGYPT", "ESTONIA", "ETHIOPIA", "FIJI", "FINLAND", "FRANCE", "GABON", "GAMBIA",
      "GEORGIA", "GERMANY", "GHANA", "GREECE", "GRENADA", "GUATEMALA", "GUINEA", "GUYANA", "HAITI", "HONDURAS", "HUNGARY", "ICELAND",
      "INDIA", "INDONESIA", "IRAN", "IRAQ", "IRELAND", "ISRAEL", "ITALY", "JAMAICA", "JAPAN", "JORDAN", "KAZAKHSTAN", "KENYA",
      "KIRIBATI", "KUWAIT", "LAOS", "LATVIA", "LEBANON", "LESOTHO", "LIBERIA", "LIBYA", "LITHUANIA", "LUXEMBOURG", "MADAGASCAR",
      "MALAWI", "MALAYSIA", "MALDIVES", "MALI", "MALTA", "MEXICO", "MICRONESIA", "MOLDOVA", "MONACO", "MONGOLIA", "MONTENEGRO",
      "MOROCCO", "MOZAMBIQUE", "MYANMAR", "NAMIBIA", "NEPAL", "NETHERLANDS", "NEW ZEALAND", "NICARAGUA", "NIGER", "NIGERIA",
      "NORWAY", "OMAN", "PAKISTAN", "PALAU", "PANAMA", "PARAGUAY", "PERU", "PHILIPPINES", "POLAND", "PORTUGAL", "QATAR", "ROMANIA",
      "RUSSIA", "RWANDA", "SAMOA", "SENEGAL", "SERBIA", "SINGAPORE", "SLOVAKIA", "SLOVENIA", "SOMALIA", "SPAIN", "SRI LANKA",
      "SUDAN", "SURINAME", "SWEDEN", "SWITZERLAND", "SYRIA", "TAIWAN", "TAJIKISTAN", "TANZANIA", "THAILAND", "TOGO", "TONGA",
      "TUNISIA", "TURKEY", "TURKMENISTAN", "TUVALU", "UGANDA", "UKRAINE", "URUGUAY", "UZBEKISTAN", "VANUATU", "VATICAN CITY",
      "VENEZUELA", "VIETNAM", "YEMEN", "ZAMBIA", "ZIMBABWE", "AMSTERDAM", "ATHENS", "BANGKOK", "BEIJING", "BERLIN", "DELHI",
      "DUBAI", "ISTANBUL", "LONDON", "MADRID", "MUMBAI", "NEW YORK", "PARIS", "ROME", "SEOUL", "TOKYO", "KERALA", "TEXAS", "CALIFORNIA"
    ];

    /* Helper: Retrieve Player Tag */
    function getMyTag() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('user') || localStorage.getItem('csg_username') || 'Player1';
    }

    /* Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'valid') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      } else if (type === 'invalid') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    /* Theme Engine */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }
    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    /* Modal System */
    function showInfoModal(title, msg) {
      document.getElementById('infoTitle').textContent = title;
      document.getElementById('infoMsg').textContent = msg;
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() {
      document.getElementById('infoModal').style.display = 'none';
      document.getElementById('placeInput').focus();
    }

    /* Game State Variables */
    let usedPlaces = new Set();
    let requiredLetter = "";
    let isPlayerTurn = true;
    let gameMode = 'bot';
    let peer = null;
    let activeConn = null;
    let currentRoomCode = '';
    let isHost = false;
    let opponentTag = 'Opponent';
    let summaryShareText = '';

    const PEER_PREFIX = 'CSG_ATLAS_';

    function switchMode(mode) {
      gameMode = mode;
      document.getElementById('modeBotBtn').classList.toggle('active', mode === 'bot');
      document.getElementById('modeRoomBtn').classList.toggle('active', mode === 'room');
      document.getElementById('roomControls').style.display = mode === 'room' ? 'flex' : 'none';
      cleanupPeer();
      resetGame();
    }

    function cleanupPeer() {
      if (activeConn) {
        activeConn.close();
        activeConn = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
    }

    function copyRoomCode() {
      const inputElem = document.getElementById('roomCodeInput');
      const code = inputElem.value.trim();
      if (!code) {
        showToast('No code to copy');
        return;
      }
      navigator.clipboard.writeText(code).then(() => {
        showToast(`Code ${code} copied!`);
      }).catch(() => {
        showToast(`Code: ${code}`);
      });
    }

    function setupDataConnection(conn) {
      activeConn = conn;

      activeConn.on('open', () => {
        showToast('Peer connected!');
        activeConn.send({ type: 'TAG_EXCHANGE', tag: getMyTag() });
        if (isHost) {
          setTurn(true);
        }
      });

      activeConn.on('data', (data) => {
        if (data.type === 'TAG_EXCHANGE') {
          opponentTag = data.tag || 'Opponent';
          if (!isPlayerTurn && gameMode === 'room') {
            document.getElementById('turnText').textContent = `${opponentTag}'s Turn...`;
          }
        } else if (data.type === 'MOVE') {
          processRemoteMove(data.word, data.player);
        } else if (data.type === 'RESET') {
          resetGame(false);
        }
      });

      activeConn.on('close', () => {
        showToast('Peer disconnected');
        activeConn = null;
      });

      activeConn.on('error', (err) => {
        showToast('Connection error');
      });
    }

    function createRoom() {
      cleanupPeer();
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      const inputElem = document.getElementById('roomCodeInput');
      inputElem.value = code;
      currentRoomCode = code;
      isHost = true;

      const peerId = PEER_PREFIX + code;
      peer = new Peer(peerId);

      peer.on('open', () => {
        showToast(`Room Created: ${code}`);
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          createRoom();
        } else {
          showToast('Failed to create room');
        }
      });

      resetGame(false);
      setTurn(false);
      document.getElementById('turnText').textContent = "Waiting for Opponent...";
    }

    function joinRoom() {
      const inputElem = document.getElementById('roomCodeInput');
      const code = inputElem.value.trim().toUpperCase();
      if (!code) { showToast('Enter room code'); return; }

      cleanupPeer();
      currentRoomCode = code;
      isHost = false;

      peer = new Peer();

      peer.on('open', () => {
        const hostPeerId = PEER_PREFIX + code;
        const conn = peer.connect(hostPeerId, { reliable: true });

        conn.on('open', () => {
          setupDataConnection(conn);
          showToast(`Joined Room: ${code}`);
        });

        conn.on('error', () => {
          showToast('Could not connect to host');
        });
      });

      peer.on('error', () => {
        showToast('Connection failed');
      });

      resetGame(false);
      setTurn(false);
      document.getElementById('turnText').textContent = `${opponentTag}'s Turn...`;
    }

    function handlePlayerSubmit(e) {
      e.preventDefault();
      if (!isPlayerTurn) return;

      const inputElem = document.getElementById('placeInput');
      const word = inputElem.value.trim().toUpperCase();

      if (!word) return;

      if (requiredLetter && word[0] !== requiredLetter) {
        playSound('invalid');
        showInfoModal("INVALID START LETTER", `Place must start with the letter '${requiredLetter}'!`);
        return;
      }

      if (usedPlaces.has(word)) {
        playSound('invalid');
        showInfoModal("ALREADY USED", `"${word}" has already been used in this game!`);
        return;
      }

      if (!PLACES.includes(word)) {
        playSound('invalid');
        showInfoModal("UNKNOWN PLACE", `"${word}" was not found in our atlas database!`);
        return;
      }

      playSound('valid');
      const myTag = getMyTag();
      addPlaceToHistory(myTag, word);
      inputElem.value = "";

      requiredLetter = word.slice(-1);
      updateBanner();

      if (gameMode === 'bot') {
        setTurn(false);
        setTimeout(botTurn, 1200);
      } else {
        if (activeConn && activeConn.open) {
          activeConn.send({ type: 'MOVE', word: word, player: myTag });
        }
        setTurn(false);
      }
    }

    function processRemoteMove(word, playerLabel) {
      playSound('valid');
      addPlaceToHistory(playerLabel, word);
      requiredLetter = word.slice(-1);
      updateBanner();
      setTurn(true);
    }

    function botTurn() {
      const candidates = PLACES.filter(p => p.startsWith(requiredLetter) && !usedPlaces.has(p));

      if (candidates.length === 0) {
        endGame("YOU WIN!", `Bot ran out of places starting with '${requiredLetter}'!`);
        return;
      }

      const botChoice = candidates[Math.floor(Math.random() * candidates.length)];
      playSound('valid');
      addPlaceToHistory('Bot', botChoice);

      requiredLetter = botChoice.slice(-1);
      updateBanner();
      setTurn(true);
    }

    function addPlaceToHistory(player, word) {
      usedPlaces.add(word);
      const historyBox = document.getElementById('historyBox');

      const entry = document.createElement('div');
      entry.className = 'history-entry';
      entry.innerHTML = `<span class="entry-player">${player}:</span> <span class="entry-word">${word.toLowerCase()}</span>`;

      historyBox.appendChild(entry);
      historyBox.scrollTop = historyBox.scrollHeight;
      document.getElementById('countText').textContent = usedPlaces.size;
    }

    function updateBanner() {
      document.getElementById('letterBanner').innerHTML = `Next place must start with: <span>${requiredLetter}</span>`;
    }

    function setTurn(playerTurn) {
      isPlayerTurn = playerTurn;
      const turnMsg = isPlayerTurn ? "Your Turn" : (gameMode === 'bot' ? "Bot Thinking..." : `${opponentTag}'s Turn...`);
      document.getElementById('turnText').textContent = turnMsg;
      document.getElementById('submitBtn').disabled = !isPlayerTurn;
      document.getElementById('placeInput').disabled = !isPlayerTurn;
      if (isPlayerTurn) document.getElementById('placeInput').focus();
    }

    function endGame(title, msg) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMsg').textContent = msg;

      summaryShareText = `🌍 Atlas Game Results:\nResult: ${title}\nPlaces Named: ${usedPlaces.size}\nPlay on ClassicSchoolGames!`;
      document.getElementById('shareResultText').textContent = `${title} | ${usedPlaces.size} Places Named`;

      document.getElementById('gameOverModal').style.display = 'flex';
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({ title: 'Atlas Game Result', text: summaryShareText }).catch(() => {});
      } else {
        navigator.clipboard.writeText(summaryShareText);
        showToast('Result copied to clipboard!');
      }
    }

    function resetGame(broadcast = true) {
      usedPlaces.clear();
      requiredLetter = "";
      document.getElementById('historyBox').innerHTML = "";
      document.getElementById('countText').textContent = "0";
      document.getElementById('letterBanner').textContent = "Start the game with any place name!";
      document.getElementById('gameOverModal').style.display = 'none';
      if (broadcast && activeConn && activeConn.open) {
        activeConn.send({ type: 'RESET' });
      }
      setTurn(true);
    }
  </script>
</body>
</html>
