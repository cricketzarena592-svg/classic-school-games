<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="frontend/css/atlas.css">
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          ClassicSchoolGames
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
          <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
        </div>
        <div class="room-actions" id="roomControls" style="display: none;">
          <button class="toggle-btn" onclick="createRoom()">Create Room</button>
          <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
          <button class="toggle-btn" onclick="copyRoomCode()">Copy Code</button>
          <button class="toggle-btn" onclick="joinRoom()">Join</button>
        </div>
      </div>

      <div class="scoreboard">
        <div>Turn: <span id="turnText" style="color:var(--chalk-white);">Your Turn</span></div>
        <div>Places Used: <span id="countText" style="color:var(--chalk-white);">0</span></div>
      </div>

      <div class="target-letter-banner" id="letterBanner">
        Start the game with any place name!
      </div>

      <div class="history-box" id="historyBox"></div>

      <form class="input-form" id="atlasForm" onsubmit="handlePlayerSubmit(event)">
        <input type="text" id="placeInput" class="place-input" placeholder="Type a country, city, or state..." autocomplete="off" required />
        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      </form>

      <!-- Info Modal -->
      <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
          <h2 id="infoTitle">NOTICE</h2>
          <p id="infoMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <button class="modal-btn" onclick="closeInfoModal()">OK</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="font-size:1.1rem; color:var(--chalk-white);"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
      <div class="chalk-piece" style="background: var(--chalk-green);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script src="frontend/js/atlas.js"></script>
</body>
</html>
