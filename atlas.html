<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas - ClassicSchoolGames</title>
  <style>
    :root {
      --bg-color: #f4f4f6;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --text-muted: #666666;
      --accent-color: #3b82f6;
      --border-color: #e0e0e0;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-color: #f0f0f0;
      --text-muted: #999999;
      --accent-color: #3b82f6;
      --border-color: #2a2a30;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-color);
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      background-color: var(--accent-color);
      display: inline-block;
      box-shadow: 2px 2px 0px var(--text-color);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover { border-color: var(--accent-color); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      gap: 1.5rem;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      box-shadow: var(--shadow);
      width: 100%;
      position: relative;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.03);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .target-letter-banner {
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
    }

    .target-letter-banner span {
      color: var(--accent-color);
      font-size: 1.6rem;
      text-transform: uppercase;
    }

    .history-box {
      width: 100%;
      height: 220px;
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--bg-color);
    }

    .history-entry {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .entry-player { font-weight: 700; color: var(--accent-color); }
    .entry-word { font-weight: 800; text-transform: capitalize; }

    .input-form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .place-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      font-weight: 600;
      outline: none;
    }

    .place-input:focus {
      border-color: var(--accent-color);
    }

    .submit-btn {
      padding: 0.75rem 1.25rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.75rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: var(--shadow);
    }

    .modal-btn {
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      background-color: var(--accent-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <span class="brand-icon"></span>
      ClassicSchoolGames
    </a>
    <div class="controls-right">
      <button class="btn" id="themeToggle">
        <span id="themeLabel">System Mode</span>
      </button>
      <a href="index.html" class="btn">← Dashboard</a>
    </div>
  </header>

  <main>
    <div class="game-card">
      <div class="scoreboard">
        <div>Turn: <span id="turnText">Your Turn</span></div>
        <div>Places Used: <span id="countText">0</span></div>
      </div>

      <div class="target-letter-banner" id="letterBanner">
        Start the game with any place name!
      </div>

      <div class="history-box" id="historyBox"></div>

      <form class="input-form" id="atlasForm" onsubmit="handlePlayerSubmit(event)">
        <input type="text" id="placeInput" class="place-input" placeholder="Type a country, city, or state..." autocomplete="off" required />
        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      </form>

      <!-- Info Modal -->
      <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
          <h2 id="infoTitle">NOTICE</h2>
          <p id="infoMsg" style="color:var(--text-muted); font-size:0.9rem;"></p>
          <button class="modal-btn" onclick="closeInfoModal()">OK</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="color:var(--text-muted); font-size:0.9rem;"></p>
          <button class="modal-btn" onclick="resetGame()">Play Again</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    /* Pre-populated Place Database */
    const PLACES = [
      "AFGHANISTAN", "ALBANIA", "ALGERIA", "ANDORRA", "ANGOLA", "ARGENTINA", "ARMENIA", "AUSTRALIA", "AUSTRIA", "AZERBAIJAN",
      "BAHAMAS", "BAHRAIN", "BANGLADESH", "BARBADOS", "BELGIUM", "BELIZE", "BENIN", "BHUTAN", "BOLIVIA", "BOTSWANA", "BRAZIL",
      "BULGARIA", "CAMBODIA", "CAMEROON", "CANADA", "CHILE", "CHINA", "COLOMBIA", "CONGO", "CROATIA", "CUBA", "CYPRUS", "CZECHIA",
      "DENMARK", "DJIBOUTI", "DOMINICA", "ECUADOR", "EGYPT", "ESTONIA", "ETHIOPIA", "FIJI", "FINLAND", "FRANCE", "GABON", "GAMBIA",
      "GEORGIA", "GERMANY", "GHANA", "GREECE", "GRENADA", "GUATEMALA", "GUINEA", "GUYANA", "HAITI", "HONDURAS", "HUNGARY", "ICELAND",
      "INDIA", "INDONESIA", "IRAN", "IRAQ", "IRELAND", "ISRAEL", "ITALY", "JAMAICA", "JAPAN", "JORDAN", "KAZAKHSTAN", "KENYA",
      "KIRIBATI", "KUWAIT", "LAOS", "LATVIA", "LEBANON", "LESOTHO", "LIBERIA", "LIBYA", "LITHUANIA", "LUXEMBOURG", "MADAGASCAR",
      "MALAWI", "MALAYSIA", "MALDIVES", "MALI", "MALTA", "MEXICO", "MICRONESIA", "MOLDOVA", "MONACO", "MONGOLIA", "MONTENEGRO",
      "MOROCCO", "MOZAMBIQUE", "MYANMAR", "NAMIBIA", "NEPAL", "NETHERLANDS", "NEW ZEALAND", "NICARAGUA", "NIGER", "NIGERIA",
      "NORWAY", "OMAN", "PAKISTAN", "PALAU", "PANAMA", "PARAGUAY", "PERU", "PHILIPPINES", "POLAND", "PORTUGAL", "QATAR", "ROMANIA",
      "RUSSIA", "RWANDA", "SAMOA", "SENEGAL", "SERBIA", "SINGAPORE", "SLOVAKIA", "SLOVENIA", "SOMALIA", "SPAIN", "SRI LANKA",
      "SUDAN", "SURINAME", "SWEDEN", "SWITZERLAND", "SYRIA", "TAIWAN", "TAJIKISTAN", "TANZANIA", "THAILAND", "TOGO", "TONGA",
      "TUNISIA", "TURKEY", "TURKMENISTAN", "TUVALU", "UGANDA", "UKRAINE", "URUGUAY", "UZBEKISTAN", "VANUATU", "VATICAN CITY",
      "VENEZUELA", "VIETNAM", "YEMEN", "ZAMBIA", "ZIMBABWE", "AMSTERDAM", "ATHENS", "BANGKOK", "BEIJING", "BERLIN", "DELHI",
      "DUBAI", "ISTANBUL", "LONDON", "MADRID", "MUMBAI", "NEW YORK", "PARIS", "ROME", "SEOUL", "TOKYO", "KERALA", "TEXAS", "CALIFORNIA"
    ];

    /* Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'valid') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      } else if (type === 'invalid') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    /* Theme Toggle */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Dark Mode';
      } else if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Light Mode';
      } else {
        const isSystemDark = systemPrefersDark.matches;
        document.documentElement.setAttribute('data-theme', isSystemDark ? 'dark' : 'light');
        themeLabel.textContent = `System (${isSystemDark ? 'Dark' : 'Light'})`;
      }
    }
    let currentPreference = localStorage.getItem('themePreference') || 'system';
    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'system' ? 'dark' : currentPreference === 'dark' ? 'light' : 'system';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });
    applyTheme(currentPreference);

    /* Modal System */
    function showInfoModal(title, msg) {
      document.getElementById('infoTitle').textContent = title;
      document.getElementById('infoMsg').textContent = msg;
      document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() {
      document.getElementById('infoModal').style.display = 'none';
      document.getElementById('placeInput').focus();
    }

    /* Game State */
    let usedPlaces = new Set();
    let requiredLetter = "";
    let isPlayerTurn = true;

    function handlePlayerSubmit(e) {
      e.preventDefault();
      if (!isPlayerTurn) return;

      const inputElem = document.getElementById('placeInput');
      const word = inputElem.value.trim().toUpperCase();

      if (!word) return;

      if (requiredLetter && word[0] !== requiredLetter) {
        playSound('invalid');
        showInfoModal("INVALID START LETTER", `Place must start with the letter '${requiredLetter}'!`);
        return;
      }

      if (usedPlaces.has(word)) {
        playSound('invalid');
        showInfoModal("ALREADY USED", `"${word}" has already been used in this game!`);
        return;
      }

      if (!PLACES.includes(word)) {
        playSound('invalid');
        showInfoModal("UNKNOWN PLACE", `"${word}" was not found in our atlas database!`);
        return;
      }

      // Valid Move
      playSound('valid');
      addPlaceToHistory('You', word);
      inputElem.value = "";
      
      const lastChar = word.slice(-1);
      requiredLetter = lastChar;
      
      updateBanner();
      setTurn(false);

      // Bot Response Delay
      setTimeout(botTurn, 1200);
    }

    function botTurn() {
      const candidates = PLACES.filter(p => p.startsWith(requiredLetter) && !usedPlaces.has(p));

      if (candidates.length === 0) {
        // Bot gives up
        document.getElementById('modalTitle').textContent = "YOU WIN!";
        document.getElementById('modalMsg').textContent = `Bot ran out of places starting with '${requiredLetter}'!`;
        document.getElementById('gameOverModal').style.display = 'flex';
        return;
      }

      const botChoice = candidates[Math.floor(Math.random() * candidates.length)];
      playSound('valid');
      addPlaceToHistory('Bot', botChoice);

      requiredLetter = botChoice.slice(-1);
      updateBanner();
      setTurn(true);
    }

    function addPlaceToHistory(player, word) {
      usedPlaces.add(word);
      const historyBox = document.getElementById('historyBox');
      
      const entry = document.createElement('div');
      entry.className = 'history-entry';
      entry.innerHTML = `<span class="entry-player">${player}:</span> <span class="entry-word">${word.toLowerCase()}</span>`;
      
      historyBox.appendChild(entry);
      historyBox.scrollTop = historyBox.scrollHeight;
      document.getElementById('countText').textContent = usedPlaces.size;
    }

    function updateBanner() {
      document.getElementById('letterBanner').innerHTML = `Next place must start with: <span>${requiredLetter}</span>`;
    }

    function setTurn(playerTurn) {
      isPlayerTurn = playerTurn;
      document.getElementById('turnText').textContent = isPlayerTurn ? "Your Turn" : "Bot Thinking...";
      document.getElementById('submitBtn').disabled = !isPlayerTurn;
      document.getElementById('placeInput').disabled = !isPlayerTurn;
      if (isPlayerTurn) document.getElementById('placeInput').focus();
    }

    function resetGame() {
      usedPlaces.clear();
      requiredLetter = "";
      document.getElementById('historyBox').innerHTML = "";
      document.getElementById('countText').textContent = "0";
      document.getElementById('letterBanner').textContent = "Start the game with any place name!";
      document.getElementById('gameOverModal').style.display = 'none';
      setTurn(true);
    }
  </script>
</body>
</html>
