<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors - ClassicSchoolGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Fredericka+the+Great&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      /* Green Chalkboard Theme (Default) */
      --board-bg: #1e3b2b;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      --chalk-white: #f8f9fa;
      --chalk-yellow: #fff3a0;
      --chalk-green: #a8ffb2;
      --chalk-blue: #9ee2ff;
      --chalk-orange: #ffd09e;
      --chalk-pink: #ffb3d9;
      --chalk-purple: #e3bfff;
      --chalk-dim: rgba(248, 249, 250, 0.4);
      --wood-border: #5c3a21;
      --wood-inner: #3d2312;
      --font-chalk-heading: 'Fredericka the Great', cursive;
      --font-chalk-hand: 'Cabin Sketch', cursive;
      --font-chalk-sub: 'Patrick Hand', cursive;
    }

    [data-theme="dark"] {
      /* Black Chalkboard Theme */
      --board-bg: #17181c;
      --board-texture: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.5) 100%);
      --wood-border: #3a2213;
      --wood-inner: #241308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0d0e;
      background-image: repeating-linear-gradient(45deg, #111 0, #111 10px, #0b0d0e 10px, #0b0d0e 20px);
      color: var(--chalk-white);
      font-family: var(--font-chalk-sub);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Wooden Blackboard Frame */
    .board-frame {
      width: 100%;
      max-width: 850px;
      background: var(--wood-border);
      border: 6px solid var(--wood-inner);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Chalkboard Surface */
    .blackboard {
      background-color: var(--board-bg);
      background-image: var(--board-texture);
      border-radius: 8px;
      border: 3px dashed rgba(255, 255, 255, 0.15);
      padding: 2rem;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Chalk Dust Overlay */
    .blackboard::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      opacity: 0.7;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-dim);
      padding-bottom: 1rem;
      position: relative;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-chalk-heading);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-decoration: none;
      color: var(--chalk-white);
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
    }

    .brand-icon {
      width: 16px;
      height: 16px;
      background-color: var(--chalk-yellow);
      display: inline-block;
      transform: rotate(-8deg);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Chalk Eraser Button */
    .eraser-btn {
      background: #c29b68;
      border: 2px solid #5c3a21;
      border-bottom: 6px solid #3d2312;
      color: #2b1a0e;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.1s ease;
      text-decoration: none;
    }

    .eraser-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    .chalk-link-btn {
      background: transparent;
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      color: var(--chalk-white);
      padding: 0.35rem 0.8rem;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .chalk-link-btn:hover {
      color: var(--chalk-yellow);
      border-color: var(--chalk-yellow);
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }

    /* Mode & Room Controls Bar */
    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.75rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      border: 2px solid var(--chalk-dim);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--chalk-dim);
      background: transparent;
      color: var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      cursor: pointer;
      font-family: var(--font-chalk-hand);
      font-size: 1.1rem;
    }

    .toggle-btn.active {
      background: var(--chalk-yellow);
      color: #17181c;
      border-color: var(--chalk-yellow);
      font-weight: 700;
    }

    .room-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .room-input {
      padding: 0.35rem 0.6rem;
      border: 2px solid var(--chalk-white);
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      color: var(--chalk-green);
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      width: 100px;
      text-transform: uppercase;
      outline: none;
    }

    .peer-status-badge {
      font-family: var(--font-chalk-hand);
      font-size: 0.95rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      border: 1px dashed var(--chalk-dim);
      color: var(--chalk-yellow);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d4d;
      display: inline-block;
    }

    .status-dot.online {
      background: var(--chalk-green);
      box-shadow: 0 0 6px var(--chalk-green);
    }

    .host-crown {
      color: var(--chalk-yellow);
      margin-left: 0.2rem;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.85rem;
      border-radius: 8px;
      border: 2px dashed var(--chalk-dim);
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
    }

    .score-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .score-num {
      font-size: 2.2rem;
      color: var(--chalk-yellow);
      text-shadow: 0 0 4px var(--chalk-yellow);
    }

    .battle-arena {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      min-height: 120px;
      padding: 1rem 0;
    }

    .choice-display {
      font-size: 4.5rem;
      user-select: none;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));
    }

    .versus-badge {
      font-family: var(--font-chalk-heading);
      font-size: 1.8rem;
      color: var(--chalk-pink);
    }

    .result-banner {
      font-family: var(--font-chalk-hand);
      font-size: 1.6rem;
      min-height: 2.2rem;
      color: var(--chalk-green);
      text-align: center;
      text-shadow: 0 0 3px var(--chalk-green);
    }

    .choices-grid {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      width: 100%;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--chalk-white);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 1rem;
      font-size: 2.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      flex: 1;
      max-width: 130px;
      transition: all 0.2s ease;
      color: var(--chalk-white);
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--chalk-yellow);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 10px var(--chalk-yellow);
    }

    .choice-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: var(--chalk-dim);
    }

    .choice-label {
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      color: var(--chalk-yellow);
    }

    /* Chalkboard Modal System */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-card {
      background-color: var(--board-bg);
      border: 3px dashed var(--chalk-yellow);
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      font-family: var(--font-chalk-sub);
    }

    .modal-card h2 {
      font-family: var(--font-chalk-heading);
      color: var(--chalk-yellow);
      font-size: 2.2rem;
    }

    .modal-btn {
      padding: 0.65rem 1rem;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      font-family: var(--font-chalk-hand);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--chalk-white);
      background-color: var(--chalk-yellow);
      color: #17181c;
    }

    .share-box {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-white);
      padding: 0.85rem;
      border-radius: 8px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      color: var(--chalk-green);
      word-break: break-all;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #c29b68;
      color: #2b1a0e;
      border: 2px solid #5c3a21;
      padding: 0.6rem 1.4rem;
      border-radius: 20px;
      font-family: var(--font-chalk-hand);
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: none;
      z-index: 200;
    }

    /* Chalk Ledge Wooden Tray */
    .chalk-tray {
      height: 18px;
      background: #4a2e18;
      border-top: 3px solid #2b1a0e;
      border-radius: 0 0 8px 8px;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .chalk-piece {
      width: 35px;
      height: 8px;
      border-radius: 3px;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="board-frame">
    <div class="blackboard">

      <header>
        <a href="index.html" class="brand">
          <span class="brand-icon"></span>
          Stone Paper Scissors
        </a>
        <div class="controls-right">
          <button class="eraser-btn" id="themeToggle">
            <span>🧹</span> <span id="themeLabel">Board Color</span>
          </button>
          <a href="index.html" class="eraser-btn">← Dashboard</a>
        </div>
      </header>

      <main>
        <div class="mode-bar">
          <div class="mode-toggle">
            <button class="toggle-btn active" id="modeBotBtn" onclick="switchMode('bot')">vs Bot</button>
            <button class="toggle-btn" id="modeRoomBtn" onclick="switchMode('room')">Room Code</button>
          </div>
          <div class="room-actions" id="roomControls" style="display: none;">
            <button class="toggle-btn" onclick="createRoom()">Create Room</button>
            <input type="text" id="roomCodeInput" class="room-input" placeholder="CODE" maxlength="6" />
            <button class="toggle-btn" onclick="joinRoom()">Join</button>
            <span class="peer-status-badge" id="peerStatusBadge">
              <span class="status-dot" id="peerStatusDot"></span>
              <span id="peerStatusText">Disconnected</span>
            </span>
          </div>
        </div>

        <div class="scoreboard">
          <div class="score-block">
            <span id="p1LabelText">YOU</span>
            <span class="score-num" id="userScore">0</span>
          </div>
          <div class="score-block">
            <span style="color:var(--chalk-dim);">Target: First to 5</span>
          </div>
          <div class="score-block">
            <span id="p2LabelText">BOT</span>
            <span class="score-num" id="botScore">0</span>
          </div>
        </div>

        <div class="battle-arena">
          <div class="choice-display" id="userDisplay">❓</div>
          <div class="versus-badge">VS</div>
          <div class="choice-display" id="botDisplay">❓</div>
        </div>

        <div class="result-banner" id="resultBanner">Make your move!</div>

        <div class="choices-grid">
          <button class="choice-btn" id="btnStone" onclick="playTurn('stone')">
            <span>🪨</span>
            <span class="choice-label">Stone</span>
          </button>
          <button class="choice-btn" id="btnPaper" onclick="playTurn('paper')">
            <span>📄</span>
            <span class="choice-label">Paper</span>
          </button>
          <button class="choice-btn" id="btnScissors" onclick="playTurn('scissors')">
            <span>✂️</span>
            <span class="choice-label">Scissors</span>
          </button>
        </div>
      </main>

      <!-- Game Over Modal -->
      <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card">
          <h2 id="modalTitle">GAME OVER</h2>
          <p id="modalMsg" style="color:var(--chalk-white); font-size:1.1rem;"></p>
          <div class="share-box" id="shareResultText">Match Result Summary</div>
          <button class="modal-btn" onclick="shareResult()">Share Result 🚀</button>
          <button class="modal-btn" onclick="resetGame()" style="background:transparent; color:var(--chalk-white); border:2px solid var(--chalk-white);">Play Again</button>
        </div>
      </div>

    </div>

    <div class="chalk-tray">
      <div class="chalk-piece" style="background: var(--chalk-white);"></div>
      <div class="chalk-piece" style="background: var(--chalk-yellow);"></div>
      <div class="chalk-piece" style="background: var(--chalk-pink);"></div>
      <div class="chalk-piece" style="background: var(--chalk-blue);"></div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>
    /* Audio Synthesizer */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      } else if (type === 'lose') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      } else if (type === 'draw') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      }
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    /* Chalkboard Theme Engine */
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Blackboard';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Greenboard';
      }
    }

    let currentPreference = localStorage.getItem('themePreference') || 'light';
    applyTheme(currentPreference);

    themeToggleBtn.addEventListener('click', () => {
      currentPreference = currentPreference === 'light' ? 'dark' : 'light';
      localStorage.setItem('themePreference', currentPreference);
      applyTheme(currentPreference);
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    /* Game Logic Variables */
    const icons = { stone: "🪨", paper: "📄", scissors: "✂️" };
    const choices = ["stone", "paper", "scissors"];
    let userScore = 0;
    let botScore = 0;
    const winningScore = 5;
    let gameMode = 'bot';
    let summaryShareText = '';

    /* PeerJS WebRTC Infrastructure */
    let peer = null;
    let dataChannel = null;
    let currentRoomCode = '';
    let isHost = false;
    let peerConnected = false;
    let p1Choice = null;
    let p2Choice = null;

    function updatePeerStatus(connected, text) {
      peerConnected = connected;
      const dot = document.getElementById('peerStatusDot');
      const label = document.getElementById('peerStatusText');
      if (dot) dot.classList.toggle('online', connected);
      if (label) label.textContent = text || (connected ? 'Connected' : 'Waiting...');
    }

    function switchMode(mode) {
      gameMode = mode;
      document.getElementById('modeBotBtn').classList.toggle('active', mode === 'bot');
      document.getElementById('modeRoomBtn').classList.toggle('active', mode === 'room');
      document.getElementById('roomControls').style.display = mode === 'room' ? 'flex' : 'none';
      
      if (mode === 'bot') {
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (peer) { peer.destroy(); peer = null; }
        document.getElementById('p1LabelText').textContent = 'YOU';
        document.getElementById('p2LabelText').textContent = 'BOT';
        updatePeerStatus(false, 'Disconnected');
      }
      resetGame(false);
    }

    function createRoom() {
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('roomCodeInput').value = code;
      
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, true);
      navigator.clipboard.writeText(newUrl.href);
      showToast(`Room Created! Direct Link Copied: ${code}`);
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) { showToast('Enter room code'); return; }
      
      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('room', code);
      window.history.pushState({}, '', newUrl);

      initRoom(code, false);
      showToast(`Joining Room: ${code}`);
    }

    function initRoom(code, host) {
      if (dataChannel) { dataChannel.close(); dataChannel = null; }
      if (peer) { peer.destroy(); peer = null; }

      currentRoomCode = code;
      isHost = host;
      updatePeerStatus(false, 'Connecting...');

      document.getElementById('p1LabelText').innerHTML = isHost ? 'YOU <span class="host-crown">👑</span>' : 'YOU';
      document.getElementById('p2LabelText').innerHTML = isHost ? 'OPPONENT' : 'OPPONENT <span class="host-crown">👑</span>';

      const peerId = isHost ? `sps_${code}` : undefined;
      peer = new Peer(peerId);

      peer.on('open', () => {
        if (!isHost) {
          dataChannel = peer.connect(`sps_${code}`);
          bindDataChannelEvents();
        }
      });

      peer.on('connection', (conn) => {
        if (isHost) {
          dataChannel = conn;
          bindDataChannelEvents();
        }
      });

      peer.on('error', (err) => {
        showToast('Connection error');
        updatePeerStatus(false, 'Failed');
      });

      resetGame(false);
    }

    function bindDataChannelEvents() {
      dataChannel.on('open', () => {
        updatePeerStatus(true, 'Connected');
        showToast('P2P Connection Established!');
        
        if (isHost) {
          sendP2PMessage({
            type: 'SYNC_STATE',
            userScore: userScore,
            botScore: botScore
          });
        }
      });

      dataChannel.on('close', () => {
        updatePeerStatus(false, 'Disconnected');
      });

      dataChannel.on('data', (data) => {
        handleP2PMessage(data);
      });
    }

    function sendP2PMessage(msg) {
      if (dataChannel && dataChannel.open) {
        dataChannel.send(msg);
      }
    }

    function handleP2PMessage(data) {
      if (data.type === 'MOVE') {
        if (isHost) p2Choice = data.choice;
        else p1Choice = data.choice;
        checkMultiplayerTurn();
      } else if (data.type === 'RESET') {
        resetGame(false);
      } else if (data.type === 'SYNC_STATE') {
        userScore = data.botScore;
        botScore = data.userScore;
        document.getElementById('userScore').textContent = userScore;
        document.getElementById('botScore').textContent = botScore;
      }
    }

    function setControlsState(enabled) {
      document.getElementById('btnStone').disabled = !enabled;
      document.getElementById('btnPaper').disabled = !enabled;
      document.getElementById('btnScissors').disabled = !enabled;
    }

    function playTurn(userChoice) {
      if (userScore >= winningScore || botScore >= winningScore) return;

      if (gameMode === 'bot') {
        const botChoice = choices[Math.floor(Math.random() * choices.length)];
        processRound(userChoice, botChoice);
      } else {
        if (!peerConnected) { showToast('Waiting for P2P connection'); return; }
        if (isHost) p1Choice = userChoice;
        else p2Choice = userChoice;

        document.getElementById('resultBanner').textContent = "Waiting for Opponent...";
        sendP2PMessage({ type: 'MOVE', choice: userChoice });
        checkMultiplayerTurn();
      }
    }

    function checkMultiplayerTurn() {
      if (p1Choice && p2Choice) {
        processRound(p1Choice, p2Choice);
        p1Choice = null;
        p2Choice = null;
      }
    }

    function processRound(c1, c2) {
      const myChoice = isHost ? c1 : c2;
      const oppChoice = isHost ? c2 : c1;

      document.getElementById('userDisplay').textContent = icons[myChoice];
      document.getElementById('botDisplay').textContent = icons[oppChoice];

      if (myChoice === oppChoice) {
        playSound('draw');
        document.getElementById('resultBanner').textContent = "It's a Draw!";
      } else if (
        (myChoice === "stone" && oppChoice === "scissors") ||
        (myChoice === "paper" && oppChoice === "stone") ||
        (myChoice === "scissors" && oppChoice === "paper")
      ) {
        playSound('win');
        userScore++;
        document.getElementById('userScore').textContent = userScore;
        document.getElementById('resultBanner').textContent = "You win this round!";
      } else {
        playSound('lose');
        botScore++;
        document.getElementById('botScore').textContent = botScore;
        document.getElementById('resultBanner').textContent = "Opponent wins this round!";
      }

      checkWinner();
    }

    function checkWinner() {
      if (userScore >= winningScore) {
        endGame("VICTORY!", `You won ${userScore} to ${botScore}!`);
      } else if (botScore >= winningScore) {
        endGame("DEFEAT!", `Opponent won ${botScore} to ${userScore}.`);
      }
    }

    function endGame(title, msg) {
      setControlsState(false);
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMsg').textContent = msg;

      summaryShareText = `✂️ Stone Paper Scissors Results:\nResult: ${title}\nFinal Score: ${userScore} - ${botScore}\nPlay on ClassicSchoolGames!`;
      document.getElementById('shareResultText').textContent = `${title} | Score: ${userScore} - ${botScore}`;

      document.getElementById('gameOverModal').style.display = 'flex';
    }

    function shareResult() {
      if (navigator.share) {
        navigator.share({ title: 'SPS Game Result', text: summaryShareText }).catch(() => {});
      } else {
        navigator.clipboard.writeText(summaryShareText);
        showToast('Result copied to clipboard!');
      }
    }

    function resetGame(broadcast = true) {
      userScore = 0;
      botScore = 0;
      p1Choice = null;
      p2Choice = null;
      setControlsState(true);
      document.getElementById('userScore').textContent = "0";
      document.getElementById('botScore').textContent = "0";
      document.getElementById('userDisplay').textContent = "❓";
      document.getElementById('botDisplay').textContent = "❓";
      document.getElementById('resultBanner').textContent = "Make your move!";
      document.getElementById('gameOverModal').style.display = 'none';

      if (broadcast && gameMode === 'room') {
        sendP2PMessage({ type: 'RESET' });
      }
    }

    // Auto-join via URL query parameter if present
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        switchMode('room');
        document.getElementById('roomCodeInput').value = roomParam;
        joinRoom();
      }
    });
  </script>
</body>
</html>
